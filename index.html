<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>雷克斯農場</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：單欄遊戲機。上方圓角狀態列，中間粉彩農場畫布，下方工具列；手機另有十字鍵與動作鈕。 */
:root{
  --ground:#d3efe3;
  --panel:#fffaf0;
  --edge:#f3c3a6;
  --ink:#6b4848;
  --muted:#a07f7a;
  --pink:#ff8fa8;
  --pink-deep:#e26b88;
  --sun:#ffc857;
  --sun-deep:#e0a12e;
  --sky:#5fb8e6;
  --leaf:#7fd08a;
  --f-display:'Chiron GoRound TC','Noto Sans TC',system-ui,sans-serif;
  --f-body:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--f-body);
  padding-block:14px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.top h1{margin:0;font:800 26px/1.1 var(--f-display);letter-spacing:.08em;color:var(--pink-deep);text-shadow:0 2px 0 #fff,0 0 0 #fff;text-wrap:balance}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font:600 14px/1 var(--f-display);
  background:var(--panel);color:var(--ink);
  padding:8px 13px;border-radius:999px;
  border:2px solid var(--edge);
  box-shadow:0 3px 0 var(--edge);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.chip.gold{color:#b9791a;border-color:var(--sun);box-shadow:0 3px 0 var(--sun-deep)}
.chip.late{color:#fff;background:var(--pink);border-color:var(--pink-deep);box-shadow:0 3px 0 var(--pink-deep)}
.chip.rain{color:#fff;background:var(--sky);border-color:#3f98c8;box-shadow:0 3px 0 #3f98c8}
.stage{position:relative;line-height:0;background:#a8dc7a;border-radius:22px;overflow:hidden;border:5px solid #fff;box-shadow:0 5px 0 var(--edge),0 10px 18px rgba(107,72,72,.16)}
canvas#game{display:block;width:100%;height:auto;aspect-ratio:10/7;image-rendering:pixelated}
.toast{
  position:absolute;left:50%;top:10px;transform:translateX(-50%);
  max-width:92%;line-height:1.5;font-size:13px;font-weight:500;text-align:center;
  background:var(--panel);color:var(--ink);border:3px solid var(--pink);border-radius:16px;
  padding:7px 14px;pointer-events:none;box-shadow:0 3px 0 var(--pink-deep);
}
.codebox{font:600 15px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;color:var(--ink)}
.gmrow{display:flex;gap:8px;align-items:center}
.gmrow .nameinput{flex:1;min-width:0;padding:8px 12px}
.gmrow .num{width:70px;padding:8px 10px}
.btn.small{min-height:32px;padding:7px 12px;font-size:12px}
.vline.sys{color:var(--muted)}
.swatch{display:inline-block;width:22px;height:22px;border-radius:7px;border:2px solid var(--edge);flex:none}
.tabs2{display:flex;gap:6px}
.tabs2 .cb{flex:1;padding:9px 4px}
.chipbtn{font:600 13px/1 var(--f-display);color:var(--ink);background:#fff;border:2px solid var(--edge);border-radius:999px;padding:8px 12px;cursor:pointer}
.chipbtn[aria-pressed=true]{background:var(--pink);color:#fff;border-color:var(--pink-deep)}
canvas#game.editing{cursor:crosshair}
.tip{background:var(--panel);border:2px solid var(--edge);border-radius:14px;padding:8px 14px;font-size:14px;line-height:1.5;min-height:40px}
.auth-card .tabs{display:flex;gap:8px}
.auth-card .tabs .cb{flex:1;padding:11px}
.auth-card label{display:flex;flex-direction:column;gap:6px;font:600 12px/1 var(--f-display);letter-spacing:.14em;color:var(--muted)}
.auth-msg{margin:0;min-height:20px;font-size:13px;line-height:1.5;color:var(--pink-deep);text-align:center}
.auth-note{margin:0;font-size:12px;line-height:1.6;color:var(--muted);text-align:center}
.fade{position:absolute;inset:0;background:#2b2140;opacity:0;pointer-events:none;transition:opacity .6s}
.fade.on{opacity:1}
.shop{position:absolute;inset:0;background:rgba(80,50,60,.45);display:flex;align-items:center;justify-content:center;padding:10px;line-height:1.4}
.card{
  width:min(500px,100%);max-height:100%;overflow:auto;
  background:var(--panel);padding:16px;border-radius:20px;border:4px solid var(--edge);
  display:flex;flex-direction:column;gap:8px;color:var(--ink);
}
.card:focus{outline:none}
.shop-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card h2{margin:0;font:800 21px/1.2 var(--f-display);color:var(--pink-deep);letter-spacing:.08em}
.card h3{margin:6px 0 0;font:600 12px/1 var(--f-display);letter-spacing:.14em;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:2px dotted var(--edge)}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.meta b{font-weight:700;font-size:14px}
.meta small{color:var(--muted);font-size:12px}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--c,#fff);box-shadow:inset -2px -2px 0 rgba(0,0,0,.14);flex:none}
.empty{margin:4px 0;color:var(--muted);font-size:13px}
.btn{
  font:600 14px/1 var(--f-display);color:#fff;background:var(--pink);
  border:0;padding:10px 16px;min-height:40px;cursor:pointer;border-radius:999px;
  box-shadow:0 4px 0 var(--pink-deep);
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pink-deep)}
.btn[disabled]{background:#d9cbc4;color:#fff;box-shadow:0 4px 0 #bdada5;cursor:not-allowed}
.btn.wide{width:100%;margin-top:8px}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--edge);box-shadow:0 4px 0 var(--edge)}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.hotbar{display:flex;flex-wrap:wrap;gap:8px}
.slot{
  position:relative;width:60px;height:60px;padding:0;cursor:pointer;color:var(--ink);
  background:var(--panel);border:3px solid var(--edge);border-radius:16px;
  box-shadow:0 4px 0 var(--edge);
}
.slot canvas{width:36px;height:36px;image-rendering:pixelated;position:absolute;left:10px;top:7px}
.slot .k{position:absolute;left:6px;top:3px;font:600 10px/1 var(--f-display);color:var(--muted)}
.slot .n{position:absolute;right:5px;bottom:3px;font:600 10px/1 var(--f-display);font-variant-numeric:tabular-nums}
.slot.sel{border-color:var(--pink);box-shadow:0 4px 0 var(--pink-deep);background:#fff0f3}
.slot.empty canvas{opacity:.35}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.bag{display:flex;flex-wrap:wrap;gap:6px}
.bagchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:7px 11px;background:var(--panel);border:2px solid var(--edge);border-radius:999px;font-variant-numeric:tabular-nums}
.pad{display:none;align-items:center;justify-content:space-between;gap:16px;padding:4px 4px 8px;touch-action:none;user-select:none;-webkit-user-select:none}
/* 類比搖桿：底盤 + 可拖動的圓鈕 */
.dpad{display:block;--sz:168px;width:var(--sz);height:var(--sz);flex:none}
.stick-base{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 50% 45%,#fff 0,var(--panel) 62%,#f6e3d3 100%);
  border:4px solid var(--edge);box-shadow:0 5px 0 var(--edge),inset 0 0 0 10px rgba(255,200,170,.18)}
.stick-knob{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;
  background:var(--pink);border:3px solid var(--pink-deep);
  box-shadow:0 4px 0 var(--pink-deep),inset 0 -5px 0 rgba(0,0,0,.06);will-change:transform}
.dpad.on .stick-knob{background:#ff7a9b}
.dpad button{
  background:var(--panel);color:var(--pink-deep);border:3px solid var(--edge);font:800 18px/1 var(--f-display);border-radius:18px;touch-action:none;
  box-shadow:0 4px 0 var(--edge);
}
.dpad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.dpad [data-d=up]{grid-column:2;grid-row:1}
.dpad [data-d=left]{grid-column:1;grid-row:2}
.dpad [data-d=right]{grid-column:3;grid-row:2}
.dpad [data-d=down]{grid-column:2;grid-row:3}
.act{
  width:100px;height:100px;border-radius:50%;border:0;touch-action:none;
  font:800 20px/1 var(--f-display);color:#fff;background:var(--pink);
  box-shadow:0 6px 0 var(--pink-deep),inset 0 -6px 0 rgba(0,0,0,.06);
}
.act:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pink-deep)}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;color:var(--muted);font-size:13px;line-height:1.7}
.foot p{margin:0;min-width:0}
kbd{font:600 12px/1 var(--f-display);color:var(--ink);background:var(--panel);padding:3px 7px;border-radius:7px;border:2px solid var(--edge)}
.foot .btn{min-height:34px;padding:8px 13px;font-size:12px}
.footbtns{display:flex;flex-wrap:wrap;gap:8px}
.village{background:var(--panel);border:3px solid var(--edge);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 0 var(--edge)}
.v-head{display:flex;align-items:center;gap:10px;min-width:0}
.v-head b{font:800 16px/1 var(--f-display);color:var(--pink-deep);letter-spacing:.08em;flex:none}
.v-count{font:600 12px/1 var(--f-display);color:var(--muted);flex:none}
.v-last{flex:1;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-head .btn{min-height:30px;padding:6px 11px;font-size:12px;flex:none}
.v-body{display:flex;flex-direction:column;gap:10px}
.v-list{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted);line-height:1.6}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 10px;border-radius:999px;background:#fff;border:2px solid var(--edge);font-size:13px;font-weight:500;color:var(--ink)}
.tbtn{font:600 12px/1 var(--f-display);color:#fff;background:var(--sky);border:0;border-radius:999px;padding:6px 10px;cursor:pointer;box-shadow:0 2px 0 #3f98c8}
.v-log{height:104px;overflow:auto;background:#fff;border:2px solid var(--edge);border-radius:14px;padding:8px 10px;font-size:13px;line-height:1.55;overflow-wrap:anywhere}
.vline b{color:var(--pink-deep);font-weight:700}
.vline.me b{color:#3f98c8}
.v-send{display:flex;gap:8px}
.v-send .nameinput{flex:1;min-width:0}
.v-quick{display:flex;flex-wrap:wrap;gap:6px}
.qbtn{font:600 13px/1 var(--f-display);color:var(--ink);background:#fff;border:2px solid var(--edge);border-radius:999px;padding:8px 12px;cursor:pointer}
.qbtn:active{transform:translateY(1px)}
.trrow{display:flex;gap:8px}
.sel{flex:1;min-width:0;font:500 15px/1.2 var(--f-body);color:var(--ink);background:#fff;border:3px solid var(--edge);border-radius:14px;padding:10px 12px}
.num{width:92px;font:500 15px/1.2 var(--f-body);color:var(--ink);background:#fff;border:3px solid var(--edge);border-radius:14px;padding:10px 12px}
.offer{background:#fff;border:2px dashed var(--edge);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.offer p{margin:0}
.tmsg{margin:0;font-size:15px;line-height:1.6;text-align:center}
.stm{position:fixed;inset:0;z-index:31;display:flex;padding:16px;background:rgba(107,72,72,.35);overflow:auto}
.stm[hidden]{display:none}
.stcard{width:min(340px,100%);margin:auto;background:var(--panel);border:4px solid var(--edge);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 5px 0 var(--edge)}
.stcard h2{margin:0;text-align:center;font:800 20px/1.2 var(--f-display);color:var(--pink-deep);letter-spacing:.08em}
.strow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.strow>b{font:700 14px/1.2 var(--f-display);color:var(--ink);flex:none}
.seg{display:flex;border:2px solid var(--edge);border-radius:999px;overflow:hidden;background:#fff}
.seg button{font:600 13px/1 var(--f-display);color:var(--ink);background:transparent;border:0;padding:8px 12px;cursor:pointer}
.seg button+button{border-left:2px solid var(--edge)}
.seg button.on{background:var(--pink);color:#fff}
.maker{
  position:fixed;inset:0;z-index:30;overflow:auto;background:var(--ground);display:flex;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.maker-card{
  width:min(580px,100%);margin:auto;background:var(--panel);border:4px solid var(--edge);border-radius:26px;
  padding:18px;display:flex;flex-direction:column;gap:16px;box-shadow:0 6px 0 var(--edge);
}
.maker-card h2{margin:0;text-align:center;font:800 24px/1.2 var(--f-display);color:var(--pink-deep);letter-spacing:.08em}
.maker-top{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
.preview{flex:none;display:flex;flex-direction:column;align-items:center;gap:10px}
.pvbox{width:156px;height:204px;display:grid;place-items:center;background:#bfe9a8;border:4px solid #fff;border-radius:22px;box-shadow:0 0 0 3px var(--edge)}
.pvbox canvas{width:128px;height:176px;image-rendering:pixelated}
.opts{flex:1 1 250px;min-width:0;display:flex;flex-direction:column;gap:12px}
.optrow{display:flex;flex-direction:column;gap:6px}
.optlabel{font:600 12px/1 var(--f-display);letter-spacing:.14em;color:var(--muted)}
.sws,.chips{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;padding:0;border-radius:50%;border:3px solid #fff;background:var(--c);box-shadow:0 0 0 2px var(--edge);cursor:pointer}
.sw[aria-pressed=true]{box-shadow:0 0 0 4px var(--pink-deep);transform:scale(1.08)}
.cb{font:600 13px/1 var(--f-display);padding:9px 13px;border-radius:999px;border:2px solid var(--edge);background:#fff;color:var(--ink);cursor:pointer}
.cb[aria-pressed=true]{background:var(--pink);color:#fff;border-color:var(--pink-deep)}
.nameinput{font:500 15px/1.2 var(--f-body);color:var(--ink);background:#fff;border:3px solid var(--edge);border-radius:14px;padding:10px 14px;width:100%;min-width:0}
.nameinput:focus{outline:3px solid var(--sky);outline-offset:1px}
.fdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#cbbdb4;margin-right:6px;vertical-align:baseline}
.fdot.on{background:#5fcf80}
.frow{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 0;border-bottom:2px dashed var(--edge)}
.frow .meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.frow small{color:#8a6a6a;font-size:13px}
.frow .acts{display:flex;gap:6px;flex-shrink:0}
.mk-msg{margin:0;text-align:center;font-size:15px;font-weight:700;line-height:1.5;color:#b3374f;background:#fff0f2;border:2px solid #f2a7b4;border-radius:14px;padding:8px 12px}
.maker-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
@media (pointer:coarse),(max-width:700px){
  .pad{display:flex}
  .keys{display:none}
}
@media (prefers-reduced-motion:reduce){.fade{transition:none}}


/* ---- 新手教學卡 ---- */
.tut{position:absolute;left:8px;bottom:8px;z-index:3;width:min(320px,calc(100% - 78px));line-height:1.5;
  background:rgba(255,250,240,.96);border:3px solid var(--pink);border-radius:16px;box-shadow:0 3px 0 var(--pink-deep);padding:8px 12px 9px;color:var(--ink);font-size:13px}
.tut p{margin:2px 0 6px;font-size:13px}
.tut-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font:600 11px/1 var(--f-display);color:var(--muted)}
.tut-t{font:800 16px/1.3 var(--f-display);color:var(--pink-deep);letter-spacing:.06em;margin-top:2px}
.tut-b{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tut-wait{font-size:11px;color:var(--muted)}
.tutx{font:600 11px/1 var(--f-display);color:var(--muted);background:none;border:0;padding:4px 0 4px 8px;cursor:pointer;text-decoration:underline}
@media (max-width:520px){.tut{left:5px;bottom:5px;width:calc(100% - 62px);padding:6px 10px 7px}.tut p{font-size:12px}.tut-t{font-size:14px}}
@media (orientation:landscape) and (max-height:560px){.tut{width:min(290px,calc(100% - 90px));padding:5px 9px 6px}.tut p{font-size:11px;margin:1px 0 4px}.tut-t{font-size:13px}}
/* ---- 快捷列 ---- */
.empop{position:absolute;right:8px;bottom:56px;z-index:4;width:196px;max-width:calc(100% - 16px);padding:7px;line-height:1.2;background:rgba(255,250,240,.97);
  border:3px solid var(--edge);border-radius:14px;box-shadow:0 3px 0 var(--edge)}
.empop[hidden]{display:none}
.empop .eg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.empop .eg+.eg{margin-top:5px;padding-top:5px;border-top:2px dashed #e8d3bf;grid-template-columns:repeat(5,1fr)}
.empop button{font:inherit;font-size:19px;line-height:1;padding:5px 0;background:#fff;border:2px solid var(--edge);border-radius:10px;cursor:pointer}
.empop button:active{transform:translateY(1px);background:#fde9c9}
.empop button:focus-visible{outline:2px solid #e8833a}
@media (max-width:520px){.empop{right:5px;bottom:48px;width:178px}.empop button{font-size:17px}}
.emobtn{position:absolute;right:8px;bottom:8px;z-index:3;width:42px;height:42px;padding:0;border-radius:50%;border:3px solid var(--edge);
  background:rgba(255,250,240,.94);box-shadow:0 3px 0 var(--edge);font-size:21px;line-height:1;cursor:pointer;-webkit-user-select:none;user-select:none}
.emobtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
@media (max-width:520px){.emobtn{right:5px;bottom:5px;width:38px;height:38px;font-size:19px}}
.dock{position:absolute;right:8px;top:8px;z-index:3;display:flex;flex-direction:column;gap:6px;line-height:1}
.dockbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;width:52px;padding:6px 0 5px;cursor:pointer;
  color:var(--ink);background:rgba(255,250,240,.94);border:3px solid var(--edge);border-radius:16px;box-shadow:0 3px 0 var(--edge);-webkit-user-select:none;user-select:none}
.dockbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.dockbtn .di{font-size:20px;line-height:1}
.dockbtn small{font:600 10px/1 var(--f-display);color:var(--muted)}
.dbadge{position:absolute;right:-6px;top:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--pink-deep);color:#fff;
  font:800 11px/18px var(--f-display);font-style:normal;text-align:center;border:2px solid #fff}
@media (max-width:520px){.dock{right:5px;top:5px;gap:4px}.dockbtn{width:40px;padding:5px 0;border-width:2px;border-radius:13px}.dockbtn .di{font-size:17px}.dockbtn small{display:none}}
@media (orientation:landscape) and (max-height:560px){.dock{flex-direction:row;right:5px;top:5px}.dockbtn{width:40px}.dockbtn small{display:none}.dockbtn .di{font-size:16px}}
/* ---- 背包 ---- */
.hbrow{display:flex;gap:6px;flex-wrap:wrap}
.hbs{position:relative;width:44px;height:44px;border:3px solid var(--edge);border-radius:12px;background:#fff}
.hbs canvas{position:absolute;left:5px;top:6px;width:28px;height:28px;image-rendering:pixelated}
.hbs i{position:absolute;left:3px;top:1px;font:600 9px/1 var(--f-display);color:var(--muted);font-style:normal}
.hbs.on{border-color:var(--pink);background:#fff0f3}
.eqrow .chipbtn{min-width:36px;padding:8px 0;text-align:center}
.bagopen{cursor:pointer;background:var(--pink);color:#fff;border-color:var(--pink-deep);font:600 13px/1 var(--f-display)}

/* ---------- 世界時間（所有玩家一樣） ---------- */
function world() {
  const ms = srvNow();
  const min = (((ms + 8 * 3600000) % 86400000) + 86400000) % 86400000 / 60000;   // 現實時間 GMT+8，0~1440 分鐘
  const hh = Math.floor(ms / 3600000);
  const wet = precipHour(hh), snow = SNOW_ON && wet && hash(hh, 0, 78) < 0.35;  // 雨雪都算「降水」；降水時作物不用澆水                         // 每個整點小時隨機決定一次天氣
  return { min, wet, snow };
}
/* 下雪開關：false = 降水時一律下雨；接近聖誕想開雪天時，改成 true 即可（不用動資料庫） */
const SNOW_ON = false;
/* 降水時段（要和 SQL 的 _precip 一致）：這個整點小時有沒有下雨或下雪 */
function precipHour(h) { return hash(h, 0, 77) < 0.25; }
/* 從 t0 到 t1（毫秒）作物「有水」的秒數：降水的小時整段都算，其餘只算到 wu（澆水的濕潤期限）為止。
   最多回算 720 小時，和 SQL 的 _wet_secs 完全相同。 */
function wetSecs(t0, t1, wu) {
  if (!(t1 > t0)) return 0;
  const h1 = Math.floor(t1 / 3600000), h0 = Math.max(Math.floor(t0 / 3600000), h1 - 720);
  let tot = 0;
  for (let h = h0; h <= h1; h++) {
    const a = Math.max(t0, h * 3600000), b = Math.min(t1, (h + 1) * 3600000);
    if (b <= a) continue;
    if (precipHour(h)) tot += b - a;
    else if (wu && wu > a) tot += Math.max(0, Math.min(b, wu) - a);
  }
  return tot / 1000;
}
function darkness(m) {
  if (m < 300) return 1;
  if (m < 360) return 1 - (m - 300) / 60;
  if (m < 1020) return 0;
  return clamp((m - 1020) / 270, 0, 1);
}

/* ---------- 作物成長（和伺服器同一套算法） ---------- */
const growSec = k => (cropCfg[k] ? cropCfg[k].grow_s : 1800);
let cropCfg = {};
function grownNow(p) {
  if (!p.crop) return 0;
  let g = p.grown;
  g += wetSecs(p.tick, srvNow(), p.wet);          // 澆過水的時間 + 下雨下雪的時間
  return Math.min(g, growSec(p.crop));
}
const progress = p => p.crop ? grownNow(p) / growSec(p.crop) : 0;
/* 可以收成：多留 3 秒緩衝，避免本機時鐘和伺服器差一點點，剛成熟就按會被伺服器退回「還沒長好」 */
const ripeNow = p => !!(p && p.crop && p.grown + wetSecs(p.tick, srvNow(), p.wet) >= growSec(p.crop) + 3);
const isWet = p => !!(p.wet && p.wet > srvNow());
function settleLocal(p) { p.grown = grownNow(p) ; p.tick = srvNow(); }
const fromServer = j => ({ crop: j.crop || null, grown: +j.grown || 0, tick: +j.tick || 0, wet: j.wet ? +j.wet : null });

function fmtDur(s) {
  s = Math.max(0, Math.ceil(s));
  if (s < 60) return '不到 1 分鐘';
  if (s < 3600) return Math.ceil(s / 60) + ' 分鐘';
  const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
  return h + ' 小時' + (m ? ' ' + m + ' 分' : '');
}

async function rpc(name, args) {
  const { data, error } = await sb.rpc(name, args || {});
  if (error) throw error;
  return data;
}
let chain = Promise.resolve(), pending = 0, resyncWanted = false;
function enqueue(fn) {
  pending++;
  const p = chain.then(fn);
  chain = p.catch(() => {}).then(() => {
    pending--;
    if (pending === 0 && resyncWanted) { resyncWanted = false; resync(); }
  });
  return p;
}
function applyState(d) {
  offset = (+d.now_ms || Date.now()) - Date.now();
  cropCfg = {};
  (d.crops || []).forEach(c => { cropCfg[c.key] = c; if (CROPS[c.key]) { CROPS[c.key].buy = c.seed; CROPS[c.key].sell = c.sell; } });
  cfg = { ...cfg, ...(d.cfg || {}) };
  if (d.profile) {
    me = { username: d.profile.username, name: d.profile.name, look: d.profile.look || {}, coins: +d.profile.coins || 0, gm: !!d.profile.gm, rod: +d.profile.rod || 1 };
  } else me = null;
  fishCat = d.fish || []; fishLog = d.fishlog || {}; rods = d.rods || [];
  bugCat = d.bugs || []; bugLog = d.buglog || {};
  soldToday = d.soldtoday || {}; soldDay = d.sell_day | 0;
  bugTaken = new Set(d.bugtaken || []); dexClaims = d.dexclaims || {};
  inv = d.inv || {};
  plots = new Map();
  (d.plots || []).forEach(j => plots.set(pk(j.x, j.y), fromServer(j)));
}
async function resync() {
  if (pending > 0) { resyncWanted = true; return; }
  try { applyState(await rpc('get_state')); refreshHud(); if (me) loadFriends(); }
  catch (e) { toast(errText(e)); }
}
/* 樂觀更新：畫面先動，伺服器稍後確認；失敗就以伺服器為準重新同步 */
function act2(name, args, onOk) {
  enqueue(async () => {
    const r = await rpc(name, args);
    if (r && r.plot !== undefined && 'p_x' in args) {
      if (r.plot) plots.set(pk(args.p_x, args.p_y), fromServer(r.plot)); else plots.delete(pk(args.p_x, args.p_y));
    }
    if (r && r.inv) Object.assign(inv, r.inv);
    if (r && typeof r.coins === 'number') me.coins = r.coins;
    if (onOk) onOk(r);
    refreshHud();
    return r;
  }).catch(e => { toast(errText(e)); resyncWanted = true; if (pending === 0) { resyncWanted = false; resync(); } });
}
const have = k => inv[k] | 0;

/* ---------- 動作 ---------- */
function act() {
  if (pose) { standUp(); return; }
  const [x, y] = facing();
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  if (scene === 'plaza') {
    const k2 = K[y][x], rp = remoteAt(x, y);
    if (catchShown) { hideCatch(); return; }
    if (fishing) { fishAct(); return; }
    if (k2 === GT) leaveVillage();
    else if (k2 === WA && curTool().id === 'rod') startFish(x, y);
    else if (k2 === WA) pop(x, y, '這是池塘（換成釣竿就能釣魚）', '#cfe8f7');
    else if (rp) openFriends(rp);
    else if (k2 === BN) takeBench(x, y);
    return;
  }
  if (scene === 'house') {
    if (K[y][x] === GT) { leaveHouse(); return; }
    const lx = x - RX, ly = y - RY, hit = house && lx >= 0 && lx < RW && ly >= -2 && ly < RH ? itemAtLocal(lx, ly) : null;
    if (hit && DISP[hit.k]) { if (visiting) visitShowList(hit); else openDisplay(hit.id); }
    else if (hit && STYLER[hit.k] && !edit.on && !visiting) openMaker(false);
    else if (hit && SEAT[hit.k] && !edit.on) takeSeat(hit, x, y);
    else if (hit) pop(x, y, (defOf(hit.k) || {}).name || '', '#fff3b0');
    return;
  }
  const k = K[y][x], key = pk(x, y), p = plots.get(key), t = curTool();
  if (k === GT) { openVMenu(); return; }
  if (k === DR) { enterHouse(); return; }
  if (k === SH) { openShop(); tutEvent('shop'); return; }
  if (catchShown) { hideCatch(); return; }
  if (fishing) { fishAct(); return; }
  if (k === WA) {
    if (t.id === 'rod') { startFish(x, y); return; }
    pop(x, y, t.id === 'can' ? '水壺永遠是滿的' : '這是池塘', '#cfe8f7'); if (t.id === 'can') splash(x, y); return;
  }
  if (k !== G) { if (t.id === 'net') swingNet(x, y); return; }
  if (t.id === 'net' && !ripeNow(p)) { swingNet(x, y); return; }
  if (ripeNow(p)) {
    const c = p.crop;
    p.crop = null; p.grown = 0; p.tick = srvNow();
    inv['c:' + c] = have('c:' + c) + 1;
    sparkle(x, y, CROPS[c].c); pop(x, y, '+1 ' + CROPS[c].n, '#fff3b0');
    act2('harvest', { p_x: x, p_y: y }); qAdd('harvest'); refreshHud(); return;
  }
  if (t.id === 'none') { pop(x, y, '這格是空的，到背包裝備物品', '#ffffff'); return; }
  if (t.id === 'rod') { pop(x, y, '面向池塘才能釣魚', '#cfe8f7'); return; }
  if (t.id === 'net') { swingNet(x, y); return; }
  if (t.id === 'hoe') {
    if (!p) {
      if (!farmable(x, y)) { pop(x, y, '這裡不能耕種', '#ffb3a8'); return; }
      plots.set(key, { crop: null, grown: 0, tick: srvNow(), wet: null }); dust(x, y);
      act2('till', { p_x: x, p_y: y }); tutEvent('till');
    } else if (!p.crop) { plots.delete(key); dust(x, y); act2('untill', { p_x: x, p_y: y }); }
    else pop(x, y, '還沒長好', '#ffffff');
  } else if (t.id === 'can') {
    if (!p) pop(x, y, '先用鋤頭翻土', '#ffffff');
    else if (world().wet) { pop(x, y, world().snow ? '下雪天不用澆水' : '下雨天不用澆水', '#cfe8f7'); tutEvent('water'); }
    else if (isWet(p)) pop(x, y, '土還是濕的', '#cfe8f7');
    else {
      settleLocal(p); p.wet = srvNow() + cfg.wet_s * 1000; drops(x, y);
      act2('water', { p_x: x, p_y: y }); tutEvent('water'); qAdd('water');
    }
  } else {
    const kk = t.crop;
    if (!p) pop(x, y, '先用鋤頭翻土', '#ffffff');
    else if (p.crop) pop(x, y, '這裡已經有作物', '#ffffff');
    else if (have('s:' + kk) <= 0) pop(x, y, '沒有種子了，去雜貨攤買', '#ffb3a8');
    else {
      inv['s:' + kk] = have('s:' + kk) - 1;
      p.crop = kk; p.grown = 0; p.tick = srvNow();
      dust(x, y); pop(x, y, '種下' + CROPS[kk].n, '#c9f0a8');
      act2('plant', { p_x: x, p_y: y, p_crop: kk }); tutEvent('plant'); qAdd('plant');
    }
  }
  refreshHud();
}

/* ---------- 每日任務：進度與獎勵都由伺服器記錄；凌晨 0 點重置（和雜貨攤同一條日界線） ---------- */
const QUESTS = [
  { id: 'plant', ic: '🌱', n: '種下作物', need: 6, reward: 60 },
  { id: 'water', ic: '💧', n: '澆水', need: 8, reward: 40 },
  { id: 'harvest', ic: '🌾', n: '收成作物', need: 6, reward: 80 },
  { id: 'fish', ic: '🎣', n: '釣到魚', need: 3, reward: 80 },
  { id: 'bug', ic: '🦋', n: '抓到蟲蝶', need: 3, reward: 80 },
];
const QBONUS = 150;
const qEl = $('qm'), qCard = $('qcard');
let qs = { day: 0, c: {}, claimed: {} }, qBusy = false, qMsg = '', qErr = false;
const qFresh = () => qs.day === sellDayNow();
const qCount = id => qFresh() ? (qs.c[id] | 0) : 0;
const qClaimed = id => qFresh() && !!qs.claimed[id];
const qDone = q => qCount(q.id) >= q.need;
const qAllClaimed = () => QUESTS.every(q => qClaimed(q.id));
const qReady = () => QUESTS.filter(q => qDone(q) && !qClaimed(q.id)).length + (qAllClaimed() && !qClaimed('bonus') ? 1 : 0);
function qBadge() { const n = ready && me ? qReady() : 0, b = $('questbadge'); b.hidden = !n; b.textContent = n; }
function qApply(d) {
  if (d) qs = { day: d.day | 0, c: d.c || {}, claimed: d.claimed || {} };
  qBadge(); if (qOpen) renderQuests();
}
async function loadQuests() { try { qApply(await rpc('quest_get')); } catch (e) { /* 伺服器還沒裝任務功能就略過 */ } }
function qAdd(id) {
  const q = QUESTS.find(x => x.id === id); if (!q) return;
  if (!qFresh()) qs = { day: sellDayNow(), c: {}, claimed: {} };
  const n = qs.c[id] | 0; if (n >= q.need) return;
  qs.c[id] = n + 1;
  if (n + 1 >= q.need) toast('每日任務完成：' + q.n + '！到「任務」領獎勵');
  qBadge(); if (qOpen) renderQuests();
  enqueue(() => rpc('quest_progress', { p_kind: id })).then(qApply).catch(() => {});
}
function renderQuests() {
  const row = (ic, name, sub, bar, btn) => '<div class="row"><span style="font-size:24px;line-height:1">' + ic + '</span><div class="meta"><b>' + name +

    (state === 'got' ? '已領取' : state === 'go' ? '領取' : '進行中') + '</button>';
  const rows = QUESTS.map(q => {
    const n = Math.min(qCount(q.id), q.need);
    return row(q.ic, q.n + ' ' + n + '/' + q.need, '獎勵 ' + q.reward + ' G', '<i class="qbar"><i style="width:' + (n / q.need * 100) + '%"></i></i>',
      btn(q.id, qClaimed(q.id) ? 'got' : qDone(q) ? 'go' : 'wait'));
  }).join('');
  const bonus = row('🎁', '全部完成加碼', '五項都領完，再得 ' + QBONUS + ' G', '', btn('bonus', qClaimed('bonus') ? 'got' : qAllClaimed() ? 'go' : 'wait'));

/* ====== 背景音樂：完全由程式即時合成（沒有音檔、沒有版權問題） ======
   C 大調的 Cmaj7 – Am7 – Fmaj7 – G6 循環：柔軟的和弦墊底、低音輕輕點拍、
   音樂盒音色的五聲音階旋律隨機漫步。夜晚變稀疏柔和，廣場變活潑一點。 */
function createMusic(win) {
  const AC = win.AudioContext || win.webkitAudioContext;
  if (!AC) return null;
  const BPM = 66, BEAT = 60 / BPM, BAR = BEAT * 4;
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const PROG = [
    { root: 48, pad: [60, 64, 67, 71] },   // Cmaj7
    { root: 45, pad: [57, 60, 64, 67] },   // Am7
    { root: 41, pad: [60, 64, 65, 69] },   // Fmaj7
    { root: 43, pad: [59, 62, 64, 67] }    // G6
  ];
  const POOL = [72, 74, 76, 79, 81, 84, 86, 88];   // C 五聲音階，兩個八度
  const st = { last: 3, run: 0 };

  function build(ctx) {
    const master = ctx.createGain(); master.gain.value = 0;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -20; comp.ratio.value = 3; comp.attack.value = 0.02; comp.release.value = 0.3;
    const tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 3200; tone.Q.value = 0.4;
    const dry = ctx.createGain(); dry.gain.value = 1;
    const send = ctx.createGain(); send.gain.value = 0.3;
    const dl = ctx.createDelay(1.5); dl.delayTime.value = BEAT * 0.75;
    const fb = ctx.createGain(); fb.gain.value = 0.38;
    const dlp = ctx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2000;
    send.connect(dl); dl.connect(dlp); dlp.connect(fb); fb.connect(dl); dlp.connect(tone);
    dry.connect(tone); tone.connect(comp); comp.connect(master); master.connect(ctx.destination);
    return { ctx, master, tone, dry, send };
  }

  function env(g, t, a, peak, hold, rel) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.setValueAtTime(peak, t + a + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + hold + rel);
  }
  function padNote(b, t, m, dur, vol) {
    const c = b.ctx, g = c.createGain();
    env(g, t, 1.4, vol, Math.max(0.1, dur - 1.4), 2.2);
    [['triangle', -4], ['sine', 5]].forEach(([type, det]) => {
      const o = c.createOscillator(); o.type = type; o.frequency.value = hz(m); o.detune.value = det;
      o.connect(g); o.start(t); o.stop(t + dur + 2.4);
    });
    g.connect(b.dry); g.connect(b.send);
  }
  function bass(b, t, m, dur, vol) {
    const c = b.ctx, g = c.createGain(), o = c.createOscillator();
    o.type = 'sine'; o.frequency.value = hz(m);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(b.dry); o.start(t); o.stop(t + dur + 0.1);
  }
  function bell(b, t, m, vol, pan) {
    const c = b.ctx, g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.9);
    [[1, 1], [2.01, 0.28], [3.0, 0.09]].forEach(([mul, amp]) => {
      const o = c.createOscillator(), og = c.createGain();
      o.type = 'sine'; o.frequency.value = hz(m) * mul; og.gain.value = amp;
      o.connect(og); og.connect(g); o.start(t); o.stop(t + 2);
    });
    let out = g;
    if (c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = pan; g.connect(p); out = p; }
    out.connect(b.dry); out.connect(b.send);
  }

  /* 排一小節。mood.calm：0 白天 ~ 1 深夜；mood.lively：0 農場 / 1 廣場 */
  function scheduleBar(b, barIdx, t0, mood) {
    const calm = Math.min(1, Math.max(0, mood.calm || 0)), lively = mood.lively ? 1 : 0;
    const ch = PROG[Math.floor(barIdx / 2) % PROG.length];
    if (barIdx % 2 === 0) ch.pad.forEach((m, i) => padNote(b, t0 + i * 0.07, m, BAR * 2 + 0.6, 0.045 - calm * 0.008));
    bass(b, t0, ch.root, BEAT * 1.9, 0.11);
    bass(b, t0 + BEAT * 2, ch.root + (barIdx % 4 === 3 ? 7 : 0), BEAT * 1.7, 0.08);
    const pcs = ch.pad.map(m => m % 12);
    const prob = 0.36 * (1 - 0.6 * calm) + lively * 0.14;
    for (let i = 0; i < 8; i++) {
      if (Math.random() > prob || st.run >= 3) { st.run = 0; continue; }
      let idx = st.last + [-2, -1, -1, 0, 1, 1, 2][Math.floor(Math.random() * 7)];
      idx = Math.min(POOL.length - 1, Math.max(0, idx));
      if (Math.random() < 0.55) {
        for (let d = 0; d < POOL.length; d++) {
          const j = idx + (d % 2 ? -1 : 1) * Math.ceil(d / 2);
          if (j >= 0 && j < POOL.length && pcs.includes(POOL[j] % 12)) { idx = j; break; }
        }
      }
      st.last = idx; st.run++;
      bell(b, t0 + i * BEAT / 2 + (Math.random() - 0.5) * 0.02, POOL[idx], (0.085 - calm * 0.025) * (0.8 + Math.random() * 0.4), (Math.random() - 0.5) * 0.7);
    }
    if (lively && barIdx % 4 === 0) {
      [0, 1, 2, 3].forEach(k => bell(b, t0 + BEAT * 0.25 * k + BEAT * 3, ch.pad[k] + 12, 0.05, k % 2 ? 0.3 : -0.3));
    }
  }

  /* ---- 即時播放 ---- */
  let ctx = null, bus = null, timer = 0, nextT = 0, bar = 0, on = true, vol = 0.5, started = false;
  const mood = { calm: 0, lively: 0 };
  const level = () => (on ? vol * vol * 0.9 : 0);
  function applyLevel() { if (bus) bus.master.gain.setTargetAtTime(level(), ctx.currentTime, 0.35); }
  function tick() {
    if (!ctx || ctx.state !== 'running') return;
    if (nextT < ctx.currentTime) nextT = ctx.currentTime + 0.1;
    while (nextT < ctx.currentTime + 1.6) { scheduleBar(bus, bar, nextT, mood); nextT += BAR; bar++; }
    bus.tone.frequency.setTargetAtTime(3200 - mood.calm * 1700, ctx.currentTime, 1.5);
  }
  function start() {
    if (started || !AC) return;
    started = true;
    try {
      ctx = new AC(); bus = build(ctx);
      if (ctx.resume) ctx.resume();
      nextT = ctx.currentTime + 0.2;
      timer = setInterval(tick, 300);
      tick(); applyLevel();
    } catch (e) { started = false; }
  }
  return {
    start, build, scheduleBar,
    setOn(v) { on = !!v; if (on && !started) start(); else if (ctx && on && ctx.resume) ctx.resume(); applyLevel(); },
    setVolume(v) { vol = Math.min(1, Math.max(0, v)); applyLevel(); },
    setMood(calm, lively) { mood.calm = calm; mood.lively = lively; },
    hidden(h) { if (!ctx) return; if (h) ctx.suspend && ctx.suspend(); else if (on && ctx.resume) ctx.resume(); },
    get on() { return on; }
  };
}

/* ---------- 廣場：即時走動與聊天（Supabase Realtime） ---------- */
/* 位置與聊天都是玩家自己送出的，收到的一律當作不可信資料：先檢查型別與範圍，再顯示。 */
const FACEIDX = { down: 0, right: 1, up: 2, left: 3 };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const remotes = new Map();
let net = null, roomInfo = null, myUid = '', pingTimer = 0, myBubble = null, myShow = null;
let lastPosKey = '', posAcc = 0, lastMoveAt = 0, lastChat = 0, lastTrackAt = 0, lastSendAt = 0;
const vPanel = $('village'), vList = $('v-list'), vLog = $('v-log');

function nameTag(txt, cx, cy, col) {
  ctx.font = '800 5px "Chiron GoRound TC", "Noto Sans TC", sans-serif';
  ctx.textAlign = 'center'; ctx.lineJoin = 'round'; ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(122,74,74,.9)';
  ctx.strokeText(txt, cx, cy);
  ctx.fillStyle = col; ctx.fillText(txt, cx, cy);
}
function bubble(b, cx, cy, now) {
  const age = now - b.at;
  if (age > 6000) return;
  ctx.font = '700 5px "Chiron GoRound TC", "Noto Sans TC", sans-serif';
  ctx.textAlign = 'center';
  const t = b.txt.length > 14 ? b.txt.slice(0, 13) + '…' : b.txt;
  const w = Math.ceil(ctx.measureText(t).width) + 8, h = 10;
  const x = Math.round(cx - w / 2), y = cy - h;
  ctx.globalAlpha = clamp((6000 - age) / 700, 0, 1);
  ob('#ffffff', '#e0b896', x, y, w, h);
  r('#e0b896', cx - 1, y + h, 3, 1); r('#ffffff', cx, y + h - 1, 1, 1);
  ctx.fillStyle = INK; ctx.fillText(t, cx, y + 7);
  ctx.globalAlpha = 1;
}
const remoteAt = (x, y) => {
  let hit = null;
  remotes.forEach(rp => { if (rp.tx === x && rp.ty === y) hit = rp; });
  return hit;
};
const intIn = (v, a, b, d) => (typeof v === 'number' && isFinite(v)) ? clamp(Math.round(v), a, b) : d;

function addLog(name, text, mine, sys) {
  const line = document.createElement('div');
  line.className = 'vline' + (mine ? ' me' : '') + (sys ? ' sys' : '');
  if (sys) line.textContent = text;
  else {
    const b = document.createElement('b'), sp = document.createElement('span');
    b.textContent = name; sp.textContent = ' ' + text;
    line.appendChild(b); line.appendChild(sp);
  }
  vLog.appendChild(line);
  while (vLog.children.length > 60) vLog.removeChild(vLog.firstChild);
  vLog.scrollTop = vLog.scrollHeight;
}
const addSys = text => addLog('', text, false, true);

function renderVillage() {
  if (!roomInfo) return;
  const n = remotes.size + 1;
  $('v-title').textContent = roomInfo.kind === 'public' ? '公開廣場 ' + roomInfo.room.replace('pub-', '#') : '私人村 ' + roomInfo.code;
  $('v-count').textContent = n + '/' + (roomInfo.cap || 8) + ' 人';
  $('v-copy').hidden = roomInfo.kind !== 'private';
  const names = [esc(me.name) + '（你）'];
  remotes.forEach(rp => names.push(esc(rp.name)));
  vList.innerHTML = names.map(x => '<span class="pchip">' + x + '</span>').join('');
}
function trackSelf() {
  if (!net || !net.ok) return;
  try { net.ch.track({ n: me.name, c: me.look, x: pl.x, y: pl.y, f: FACEIDX[pl.face], s: pose && pose.bench ? 1 : 0 }); } catch (e) { /* 略過 */ }
}
function onSync(ch) {
  if (!net || net.ch !== ch) return;
  const state = ch.presenceState() || {};
  const seen = new Set();
  Object.keys(state).forEach(id => {
    if (id === myUid) return;
    const m = (state[id] && state[id][0]) || {};
    const name = clean(m.n, 8) || '旅人';
    const x = intIn(m.x, 0, W - 1, 10), y = intIn(m.y, 0, H - 1, 11), f = intIn(m.f, 0, 3, 0);
    seen.add(id);
    let rp = remotes.get(id);
    if (!rp) {
      rp = { id, name, char: toChar(name, m.c), x, y, tx: x, ty: y, f, bubble: null, sit: m.s === 1 && pkind[y][x] === BN };
      remotes.set(id, rp);
      if (net.synced) addSys(name + ' 來到廣場');
    } else {
      rp.name = name; rp.char = toChar(name, m.c);
      if (performance.now() - (rp.posAt || 0) > 800) { rp.tx = x; rp.ty = y; rp.f = f; rp.sit = m.s === 1 && pkind[y][x] === BN; }   // 剛收到更新的走動訊息就不要被舊位置蓋回去
    }
  });
  remotes.forEach((rp, id) => { if (!seen.has(id)) { remotes.delete(id); addSys(rp.name + ' 離開了'); } });
  net.synced = true;
  renderVillage();
}
function onPos(p) {
  if (!p || typeof p !== 'object') return;
  const rp = typeof p.i === 'string' ? remotes.get(p.i) : null;
  if (!rp) return;
  const nx = intIn(p.x, 0, W - 1, rp.tx), ny = intIn(p.y, 0, H - 1, rp.ty);
  if (nx !== rp.tx || ny !== rp.ty) rp.fish = null;
  rp.tx = nx; rp.ty = ny; rp.f = intIn(p.f, 0, 3, rp.f); rp.posAt = performance.now();
  rp.sit = p.s === 1 && pkind[ny][nx] === BN;                  // 只有真的在長椅那一格才當作坐著
}
/* 別人釣魚：只畫釣竿和浮標（收到的資料一律檢查：座標要在範圍內、而且要是池塘的水面） */
function onFish(p) {
  if (!p || typeof p !== 'object') return;
  const rp = typeof p.i === 'string' ? remotes.get(p.i) : null;
  if (!rp) return;
  if (p.a !== 1) { rp.fish = null; return; }
  const x = intIn(p.x, 0, W - 1, -1), y = intIn(p.y, 0, H - 1, -1);
  if (x < 0 || y < 0 || K[y][x] !== WA) { rp.fish = null; return; }
  const bite = p.b === 1;
  if (rp.fish && rp.fish.x === x && rp.fish.y === y) rp.fish.phase = bite ? 'bite' : rp.fish.phase;
  else rp.fish = { x, y, phase: bite ? 'bite' : 'cast', t0: Date.now() };
  if (rp.fish.phase === 'cast') setTimeout(() => { if (rp.fish && rp.fish.phase === 'cast') rp.fish.phase = 'wait'; }, 400);
}
/* 別人展示魚或蟲蝶：只認得自己清單裡的種類，名字和稀有度用本機的資料，不用對方送來的文字 */
function onShow(p) {
  if (!p || typeof p !== 'object') return;
  const rp = typeof p.i === 'string' ? remotes.get(p.i) : null;
  const kd = p.t === 'bug' ? 'bug' : 'fish';
  const f = typeof p.k === 'string' ? (kd === 'bug' ? bugCat : fishCat).find(x => x.key === p.k) : null;
  if (!rp || !f) return;
  const rc = RARITY[f.rarity] || ['', '#e0b896'];
  rp.show = { kind: kd, k: f.key, name: f.name, col: rc[1], at: performance.now() };
  addLog(rp.name, '展示了「' + f.name + '」（' + rc[0] + '）', false);
}
function onChat(p) {
  if (!p || typeof p !== 'object') return;
  const rp = typeof p.i === 'string' ? remotes.get(p.i) : null;
  const text = clean(p.t, 40).trim();
  if (!rp || !text) return;
  rp.bubble = { txt: text, at: performance.now() };
  addLog(rp.name, text, false);
}
/* 同一個主題的頻道在 supabase-js 裡會被重用：舊的還沒離開乾淨就用同名開新的，會拿到壞掉的舊頻道。
   所以每次換頻道都要等舊的完全移除後才建立新的。 */
let netGate = Promise.resolve(), netTok = 0;
const dropChannel = ch => { try { return Promise.resolve(sb.removeChannel(ch)).catch(() => {}); } catch (e) { return Promise.resolve(); } };
function stopNet() {
  netTok++;
  if (!net) return;
  const n = net; net = null;
  netGate = netGate.then(() => dropChannel(n.ch));
}
function startNet(rm, priv) {
  stopNet();
  const tok = netTok;
  netGate.then(() => {
    if (tok !== netTok) return;                // 等待期間已經離開或換房了
    const ch = sb.channel('village:' + rm, { config: { private: priv, presence: { key: myUid }, broadcast: { self: false, ack: false } } });
    net = { ch, room: rm, priv, ok: false, wasOk: false, bad: 0, synced: false };
    ch.on('presence', { event: 'sync' }, () => onSync(ch))
      .on('broadcast', { event: 'pos' }, m => onPos(m && m.payload))
      .on('broadcast', { event: 'chat' }, m => onChat(m && m.payload))
      .on('broadcast', { event: 'fish' }, m => onFish(m && m.payload))
      .on('broadcast', { event: 'show' }, m => onShow(m && m.payload))
      .on('broadcast', { event: 'emo' }, m => onEmo(m && m.payload))
      .subscribe(status => {
        if (!net || net.ch !== ch) return;
        if (status === 'SUBSCRIBED') { net.ok = true; net.wasOk = true; net.bad = 0; lastSendAt = 0; trackSelf(); }
        else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
          if (net.ok || net.wasOk) { net.ok = false; return; }   // 連上後才斷線：supabase-js 會自動重連，netWatch 看門狗負責兜底
          if (status === 'CLOSED') return;
          if (priv) startNet(rm, false);          // 備援：改用公開頻道
          else { addSys('連不上即時連線，暫時只能看到自己。'); toast('廣場的即時連線失敗，請重新整理再試'); }
        }
      });
  });
}
function enterPlaza(info) {
  roomInfo = info; scene = 'plaza'; K = pkind; pose = null;
  remotes.clear(); vLog.innerHTML = ''; myBubble = null; myShow = null; lastPosKey = ''; posAcc = 0;
  pl.x = pl.sx = 10; pl.y = pl.sy = 11; pl.prog = 1; pl.face = 'up'; pressed.length = 0;
  vPanel.hidden = false; renderVillage();
  addSys(info.kind === 'public' ? '歡迎來到公開廣場，和路過的朋友打個招呼吧。' : '私人村的邀請碼是 ' + info.code + '，把它傳給朋友就能進來。');
  startNet(info.room, true);
  clearInterval(pingTimer);
  pingTimer = setInterval(async () => {
    try {
      const alive = await rpc('village_ping');
      if (!alive && roomInfo && scene === 'plaza') {                 // 太久沒心跳被移出了，重新登記
        const again = await rpc('village_join', roomInfo.kind === 'private' ? { p_mode: 'private_join', p_code: roomInfo.code } : { p_mode: 'public', p_code: null });
        if (again.room !== roomInfo.room) enterPlaza(again);
      }
    } catch (e) { /* 下次再試 */ }
  }, 20000);
}
function leaveVillage(silent) {
  stopNet(); clearInterval(pingTimer); if (pose && pose.bench) pose = null;
  const was = scene === 'plaza';
  scene = 'farm'; K = kind; roomInfo = null; remotes.clear(); myBubble = null; myShow = null;
  vPanel.hidden = true;
  if (sb && ready) rpc('village_leave').catch(() => {});
  if (was) {
    pl.x = pl.sx = 18; pl.y = pl.sy = 5; pl.prog = 1; pl.face = 'left'; pressed.length = 0;
    if (!silent) toast('回到農場了');
  }
}
async function joinVillage(mode, code, k) {
  try {
    const info = mode === 'room' ? await rpc('village_join_pub', { p_k: k }) : await rpc('village_join', { p_mode: mode, p_code: code || null });
    closeVMenu(); enterPlaza(info);
  } catch (e) { toast(errText(e)); renderVMenu(); loadVRooms(); }
}
function sendPos(dt) {
  posAcc += dt;
  const now = performance.now();
  const key = pl.x + ',' + pl.y + ',' + pl.face + ',' + (pose && pose.bench ? 1 : 0);
  const moved = key !== lastPosKey && posAcc >= 120;
  const beat = !!(net && net.ok) && now - lastSendAt > 3000;   // 心跳：站著不動也每 3 秒補一次位置，弄丟的訊息會自己補回來
  if ((moved || beat) && net && net.ok) {
    posAcc = 0; lastPosKey = key; lastSendAt = now;
    if (moved) lastMoveAt = now;
    try { net.ch.send({ type: 'broadcast', event: 'pos', payload: { i: myUid, x: pl.x, y: pl.y, f: FACEIDX[pl.face], s: pose && pose.bench ? 1 : 0 } }); } catch (e) { /* 略過 */ }
    if (moved && now - lastTrackAt > 1500) { lastTrackAt = now; trackSelf(); }   // presence 只當備援，降低頻率以免超過 Realtime 的訊息上限
  }

}
/* 看門狗：頻道連上後如果掉線又沒自己恢復，就整條重建；回到前景、網路恢復時也會檢查 */
function netWatch(force) {
  if (!ready || !sb) return;
  if (scene === 'plaza' && roomInfo && net) {
    const st = net.ch.state;
    if (st === 'joined') { net.bad = 0; if (!net.ok) { net.ok = true; trackSelf(); } }
    else if (net.wasOk && (force || ++net.bad >= 2)) { addSys('連線中斷，重新連線中…'); startNet(net.room, net.priv); return; }
  }
  if (pres) {
    if (pres.ch.state === 'joined') { pres.bad = 0; if (!pres.ok) { pres.ok = true; trackWhere(true); } }
    else if (pres.ok && (force || (pres.bad = (pres.bad || 0) + 1) >= 2)) startPresence();
  }
}
setInterval(netWatch, 4000);
document.addEventListener('visibilitychange', () => {

  if (fTab === 'furn') {
    rows = house.list.filter(c => ['floor', 'flat', 'wall'].includes(c.layer)).map(c =>
      '<div class="row"><div class="meta"><b>' + esc(c.name) + '</b><small>' + c.w + '×' + c.h + ' 格 · ' + (c.layer === 'wall' ? '掛牆' : c.layer === 'flat' ? '地毯' : '落地') + ' · 持有 ' + have('f:' + c.key) + '</small></div>' +
      '<button type="button" class="btn small" data-a="buy" data-c="' + esc(c.key) + '"' + (fsBusy || coins < c.price ? ' disabled' : '') + '>' + c.price + ' G</button></div>').join('');
  } else {
    const kd = fTab, names = kd === 'wall' ? WALL_NAMES : FLOOR_NAMES, cur = house.style[kd];
    rows = names.map((n, i) => {
      const key = kd + '_' + i, c = house.cat[key], owned = i === 0 || have('f:' + key) > 0, price = c ? c.price : 0;
      return '<div class="row"><i class="swatch" style="background:' + iconRowColor[kd][i] + '"></i><div class="meta"><b>' + n + '</b><small>' + (cur === i ? '目前使用中' : owned ? '已擁有' : price + ' G') + '</small></div>' +
        (cur === i ? '' : '<button type="button" class="btn small" data-a="style" data-c="' + i + '"' + (fsBusy || (!owned && coins < price) ? ' disabled' : '') + '>' + (owned ? '套用' : '買並套用') + '</button>') + '</div>';
    }).join('');
  }
  fsCard.innerHTML = '<div class="shop-h"><h2>家具店</h2><span class="chip gold">' + coins + ' G</span></div>' +
    '<div class="tabs2">' + tab('furn', '家具') + tab('wall', '牆面') + tab('floor', '地板') + '</div>' + rows +
    '<button type="button" class="btn ghost wide" data-a="close">關閉</button>';
}
let fsBusy = false;
function openFShop() { if (!house) return; fOpen = true; pressed.length = 0; renderFShop(); fsEl.hidden = false; fsCard.focus(); }
function closeFShop() { fOpen = false; fsEl.hidden = true; renderHousePanel(); }
$('h-shop').addEventListener('click', openFShop);
fsCard.addEventListener('click', async e => {
  const b = e.target.closest('button[data-a]');
  if (!b || b.disabled) return;
  const a = b.dataset.a, c = b.dataset.c;
  if (a === 'close') { closeFShop(); return; }
  if (a === 'tab') { fTab = c; renderFShop(); return; }
  fsBusy = true; renderFShop();
  try {
    const r_ = await enqueue(() => a === 'buy' ? rpc('buy_furniture', { p_item: c, p_qty: 1 }) : rpc('house_style', { p_kind: fTab, p_idx: +c }));
    if (r_.inv) Object.assign(inv, r_.inv);
    if (typeof r_.coins === 'number') me.coins = r_.coins;
    if (r_.style) house.style = r_.style;
  } catch (err) { toast(errText(err)); await resync(); }
  fsBusy = false;
  if (fOpen) renderFShop();
  refreshHud();
});

/* ---------- 房間繪製 ---------- */
function drawRoom(now) {
  r('#5a4040', 0, 0, W * T, H * T);
  r('#7a5656', 3 * T, 2 * T, 14 * T, 11 * T);
  const ws = house ? house.style.wall : 0, fs = house ? house.style.floor : 0;
  for (let ty = RY - 2; ty < RY; ty++) for (let tx = RX; tx < RX + RW; tx++) drawWallTile(tx * T, ty * T, tx, ty, ws);
  r('#c98f62', RX * T, RY * T - 2, RW * T, 2); r('#e8b27a', RX * T, RY * T - 3, RW * T, 1);
  for (let ty = RY; ty < RY + RH; ty++) for (let tx = RX; tx < RX + RW; tx++) drawFloorTile(tx * T, ty * T, tx, ty, fs);
  r('rgba(90,60,40,.18)', RX * T, RY * T, RW * T, 2);
  ob('#ff8fa8', '#d4688a', 9 * T + 2, 12 * T + 3, 2 * T - 4, 9); r('#ffd1e0', 9 * T + 6, 12 * T + 6, 2 * T - 12, 3);
  if (!house) return;
  const draw1 = it => drawFurn(it, it.x * T + RX * T, it.y * T + RY * T, now);
  house.items.filter(it => (defOf(it.k) || {}).layer === 'flat').forEach(draw1);
  house.items.filter(it => (defOf(it.k) || {}).layer === 'wall').forEach(draw1);
}
function houseEnts(now) {
  if (!house) return [];
  return house.items.filter(it => (defOf(it.k) || {}).layer === 'floor').map(it => {
    const d = defOf(it.k);
    return { y: RY + it.y + d.h - 1 + 0.01, draw: () => drawFurn(it, it.x * T + RX * T, it.y * T + RY * T, now) };
  });
}
function drawEditOverlay(now) {
  if (scene !== 'house' || !edit.on || !house) return;
  const box = (g_, col) => {
    const x = (RX + g_.x) * T, y = (RY + g_.y) * T, w = g_.w * T, h = g_.h * T;
    ctx.globalAlpha = 0.7 + 0.3 * Math.sin(now / 160);
    r(col, x, y, w, 1); r(col, x, y + h - 1, w, 1); r(col, x, y, 1, h); r(col, x + w - 1, y, 1, h);
    ctx.globalAlpha = 1;
  };
  r('rgba(255,255,255,.07)', RX * T, RY * T, RW * T, RH * T);
  const selIt = house.items.find(i => i.id === edit.sel);
  if (selIt) { const g_ = itemRect(selIt); if (g_) box(g_, '#ff5f8a'); }
  if (edit.hold && edit.hover) {
    const d = defOf(edit.hold.k);
    if (d) {
      const [ax, ay] = anchorFor(edit.hold.k, edit.hover[0], edit.hover[1]);
      const okp = fitsLocal(edit.hold.k, ax, ay, edit.hold.fromId);
      ctx.globalAlpha = 0.6;
      drawFurn({ k: edit.hold.k, f: edit.hold.f }, (RX + ax) * T, (RY + ay) * T, now);
      ctx.globalAlpha = 1;
      r(okp ? 'rgba(120,255,160,.30)' : 'rgba(255,80,80,.40)', (RX + ax) * T, (RY + ay) * T, d.w * T, d.h * T);
    }
  }
}

/* ---------- 更新與繪製 ---------- */
let moodAcc = 0;
function update(dt) {
  const snowing = world().snow;
  rain.forEach(d => {
    if (snowing) { d.y += dt * 0.05; d.x += Math.sin(d.y / 9 + d.x) * dt * 0.012 - dt * 0.004; }
    else { d.y += dt * 0.26; d.x -= dt * 0.06; }
    if (d.y > H * T) { d.y = -4; d.x = Math.random() * (W * T + 20); }
    if (d.x < 0) d.x += W * T;
  });
  for (let i = fx.length - 1; i >= 0; i--) {
    const p = fx[i];
    p.l += dt; p.x += p.vx * dt / 16; p.y += p.vy * dt / 16; p.vy += 0.05 * dt / 16;
    if (p.l > p.max) fx.splice(i, 1);
  }
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i];
    p.l += dt; p.y -= dt * 0.012;
    if (p.l > 1100) pops.splice(i, 1);
  }
  const lk = Math.min(1, dt / 110);
  remotes.forEach(rp => { rp.x += (rp.tx - rp.x) * lk; rp.y += (rp.ty - rp.y) * lk; });
  if (scene === 'plaza') sendPos(dt);
  moodAcc += dt;
  if (moodAcc > 1000) { moodAcc = 0; if (Music) Music.setMood(darkness(world().min), scene === 'plaza'); }
  fishTick();
  if (paused()) { actQueued = false; return; }
  if (anim && (pressed.length || pose || pl.prog < 1)) anim = null;   // 走動或坐下就中斷動作
  if (pose) {                                   // 坐著或躺著：家具被搬走、離開屋子或按方向鍵就起身
    const pit = !pose.bench && scene === 'house' && house ? house.items.find(i => i.id === pose.id) : null;
    if (scene !== (pose.bench ? 'plaza' : 'house')) pose = null;
    else if (!pose.bench && (!pit || pit.x !== pose.ix || pit.y !== pose.iy)) standUp();
    else {
      pose.t += dt;
      if (pose.type === 'lie' && pose.t > 2400) { pose.t = 0; pop(pl.x, pl.y - 0.6, 'Zzz', '#cfe8f7'); }
      if (pressed.length) standUp();
    }
  }
  updateCritters(dt);
  if (pl.prog < 1) pl.prog = Math.min(1, pl.prog + dt / stepMs());
  if (pl.prog >= 1) {
    const d = pressed[pressed.length - 1];
    if (d) tryMove(d);
  }
  if (actQueued) { actQueued = false; act(); }
  updateClock(); updateTip();
}

function draw(now) {
  g = ctx;
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.imageSmoothingEnabled = false;
  const w = world(), dark = darkness(w.min);
  if (scene === 'house') drawRoom(now);
  else {
  for (let ty = 0; ty < H; ty++) for (let tx = 0; tx < W; tx++) {
    const k = K[ty][tx], px = tx * T, py = ty * T;
    if (k === WA) drawWater(px, py, tx, ty, now);
    else if (k === P) drawPath(px, py, tx, ty);
    else if (k === TR) drawTree(px, py, tx, ty);
    else if (k === GT) { drawPath(px, py, tx, ty); drawGate(px, py, now); }
    else if (k === FR) drawRim(px, py, tx, ty);
    else {
      drawGrass(px, py, tx, ty);
      if (k === BN) drawBench(px, py);
      else if (k === G && scene === 'farm') {
        const p = plots.get(pk(tx, ty));
        if (p) {
          drawSoil(px, py, isWet(p) || w.wet);
          if (p.crop) drawCrop(px, py, { t: p.crop, p: progress(p) }, now);
        } else if (farmable(tx, ty)) r('rgba(255,255,255,.07)', px, py, T, T);
      }
    }
  }
  if (scene === 'farm') { drawHouse(dark > 0.15, now); drawShop(dark > 0.15, now); }
  else {
    for (let i = 0; i < 5; i++) {
      const a = now / 520 + i * 1.3, yy = 7 * T + 2 - Math.abs(Math.sin(a)) * 9;
      r('#bfe6ff', 10 * T + 4 + i * 2 + ((i % 2) ? 1 : 0), Math.round(yy), 1, 2);
    }
  }
  }

  const e = pl.prog;
  const rx = pl.sx + (pl.x - pl.sx) * e, ry = pl.sy + (pl.y - pl.sy) * e;
  const ents = [];
  if (ready) {
    const ch = myChar();
    const pit = pose && scene === 'house' && house ? house.items.find(i => i.id === pose.id) : null;
    if (pit) {
      ents.push({ y: pose.sort, draw: () => {
        const px = Math.round(pl.x * T), py = Math.round(pl.y * T);
        if (pose.type === 'lie') {
          drawLying(pit, ch);
          nameTag(ch.name, (RX + pit.x) * T + (pit.f ? 23 : 9), (RY + pit.y) * T + 1, '#ffffff');
        } else {
          drawSeated(px, py, pit, ch);
          nameTag(ch.name, px + 8, py - 7, '#ffffff');
        }
      } });
    } else if (pose && pose.bench && scene === 'plaza') {
      ents.push({ y: ry, draw: () => {
        drawBenchSeated(Math.round(pl.x * T), Math.round(pl.y * T), ch);
        nameTag(ch.name, Math.round(pl.x * T) + 8, Math.round(pl.y * T) - 7, '#ffffff');
      } });
    } else ents.push({ y: ry, draw: () => {
      drawPlayerFx(Math.round(rx * T), Math.round(ry * T), pl.face, pl.prog < 1, (Math.floor(pl.prog * 2) + pl.step) % 2, ch, pl.prog < 1 ? null : animFx(anim, now));
      nameTag(ch.name, Math.round(rx * T) + 8, Math.round(ry * T) - 5, '#ffffff');
    } });
  }
  if (scene === 'house') houseEnts(now).forEach(en => ents.push(en));
  if (scene === 'farm') critters.forEach(c => {
    const fr = Math.floor(now / (c.fly ? 130 : 260) + c.ph) % 2, bob = c.fly ? Math.round(5 + Math.sin(now / 300 + c.ph) * 2) : 0;
    ents.push({ y: c.y + (c.fly ? 1.2 : 0), draw: () => {
      const px = Math.round(c.x * T) - 8, py = Math.round(c.y * T) - 12;
      if (c.fly) r('rgba(40,70,30,.22)', px + 5, py + 13, 6, 2);
      bugPix(c.key, fr, px, py - bob, false);
    } });
  });
  if (scene === 'plaza') remotes.forEach(rp => ents.push({ y: rp.y, draw: () => {
    const mv = Math.abs(rp.tx - rp.x) + Math.abs(rp.ty - rp.y) > 0.05;
    const px = Math.round(rp.x * T), py = Math.round(rp.y * T);
    const seated = rp.sit && !mv;
    if (seated) drawBenchSeated(px, py, rp.char);
    else {
      if (mv) rp.anim = null;
      drawPlayerFx(px, py, FACES[rp.f], mv, Math.floor(now / 140) % 2, rp.char, mv ? null : animFx(rp.anim, now));
    }
    if (rp.fish && !mv) drawRod(px, py, FACES[rp.f], rp.fish, now);
    nameTag(rp.name, px + 8, py - (seated ? 7 : 5), '#fff3b0');
  } }));
  ents.sort((a, b) => a.y - b.y).forEach(en => en.draw());
  if (ready && myEmo) emoteBubble(myEmo, Math.round(rx * T) + 13, Math.round(ry * T) - 6, now);
  if (scene === 'plaza') remotes.forEach(rp => { if (rp.emo) emoteBubble(rp.emo, Math.round(rp.x * T) + 13, Math.round(rp.y * T) - 6, now); });
  if (scene !== 'plaza' && myShow) showCard(myShow, Math.round(rx * T) + 8, Math.round(ry * T) - 11, now);
  if (scene === 'plaza') {
    if (myBubble) bubble(myBubble, Math.round(rx * T) + 8, Math.round(ry * T) - 11, now);
    if (myShow) showCard(myShow, Math.round(rx * T) + 8, Math.round(ry * T) - (myBubble && now - myBubble.at < 6000 ? 23 : 11), now);
    remotes.forEach(rp => {
      if (rp.bubble) bubble(rp.bubble, Math.round(rp.x * T) + 8, Math.round(rp.y * T) - 11, now);
      if (rp.show) showCard(rp.show, Math.round(rp.x * T) + 8, Math.round(rp.y * T) - (rp.bubble && now - rp.bubble.at < 6000 ? 23 : 11), now);
    });
  }

  drawFishing(now);
  drawEditOverlay(now);
  fx.forEach(p => {
    ctx.globalAlpha = clamp(1 - p.l / p.max, 0, 1);
    r(p.c, p.x | 0, p.y | 0, 2, 2);
  });
  ctx.globalAlpha = 1;

  const indoors = scene === 'house';
  const warm = indoors ? 0 : Math.max(0, 1 - Math.abs(w.min - 1110) / 100) * 0.2;
  if (warm > 0) r('rgba(255,150,130,' + warm.toFixed(3) + ')', 0, 0, W * T, H * T);
  if (dark > 0 && !indoors) r('rgba(70,50,130,' + (dark * 0.45).toFixed(3) + ')', 0, 0, W * T, H * T);
  if (w.wet && !indoors) {
    if (w.snow) {
      r('rgba(225,238,255,.16)', 0, 0, W * T, H * T);
      rain.forEach((d, i) => { const s = i % 3 === 0 ? 2 : 1; r('rgba(255,255,255,.95)', d.x | 0, d.y | 0, s, s); });
    } else {
      r('rgba(90,110,150,.14)', 0, 0, W * T, H * T);
      rain.forEach(d => r('rgba(235,245,255,.85)', d.x | 0, d.y | 0, 1, 3));
    }
  }

  if (scene === 'farm') {
    critters.forEach(c => {
      if (c.key !== 'firefly' || dark < 0.2) return;
      const gx = Math.round(c.x * T) - 12, gy = Math.round(c.y * T) - 12 - Math.round(5 + Math.sin(now / 300 + c.ph) * 2), pu = 0.5 + 0.5 * Math.sin(now / 350 + c.ph);
      r('rgba(255,242,122,' + (0.10 + 0.12 * pu).toFixed(3) + ')', gx - 4, gy - 4, 10, 10);
      r('rgba(255,242,122,' + (0.25 + 0.3 * pu).toFixed(3) + ')', gx - 2, gy - 2, 6, 6);
    });
    if (netSwing) {
      const a = (performance.now() - netSwing.t0) / 260;
      if (a >= 1) netSwing = null;
      else {
        const cx = netSwing.x * T + 8, cy = netSwing.y * T + 8, rad = 7 + a * 3;
        ctx.globalAlpha = 1 - a;
        for (let i = 0; i < 10; i++) { const ang = -Math.PI * 0.9 + a * Math.PI * 1.8 + i * 0.12; r('#ffffff', Math.round(cx + Math.cos(ang) * rad), Math.round(cy + Math.sin(ang) * rad), 2, 2); }
        ctx.globalAlpha = 1;
      }
    }
  }

  const [fx_, fy_] = facing();
  if (fx_ >= 0 && fy_ >= 0 && fx_ < W && fy_ < H && !paused() && !pose) {
    ctx.globalAlpha = 0.65 + 0.35 * Math.sin(now / 160);
    const bx = fx_ * T, by = fy_ * T, c = '#ff5f8a';
    r(c, bx, by, 3, 1); r(c, bx, by, 1, 3);
    r(c, bx + T - 3, by, 3, 1); r(c, bx + T - 1, by, 1, 3);
    r(c, bx, by + T - 1, 3, 1); r(c, bx, by + T - 3, 1, 3);
    r(c, bx + T - 3, by + T - 1, 3, 1); r(c, bx + T - 1, by + T - 3, 1, 3);
    ctx.globalAlpha = 1;
  }

  ctx.font = '800 7px "Chiron GoRound TC", "Noto Sans TC", sans-serif';
  ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  pops.forEach(p => {
    ctx.globalAlpha = clamp(1.6 - p.l / 700, 0, 1);
    ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(122,74,74,.95)';
    ctx.strokeText(p.txt, p.x, p.y);
    ctx.fillStyle = p.col; ctx.fillText(p.txt, p.x, p.y);
  });
  ctx.globalAlpha = 1;
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(60, now - last);
  last = now;
  update(dt);
  draw(now);
  requestAnimationFrame(frame);
}

/* ---------- 啟動 ---------- */
async function boot() {
  refreshHud();
  requestAnimationFrame(frame);
  const lib = window.supabase;
  if (!lib || /YOUR-PROJECT/.test(SUPABASE_URL) || /YOUR-PUBLISHABLE/.test(SUPABASE_KEY)) {
    authEl.hidden = true;
    setBoot(lib ? '還沒設定連線' : '無法載入連線元件', lib ? '請把 index.html 最上面的 SUPABASE_URL 與 SUPABASE_KEY 換成你自己專案的值。' : '請檢查網路後重新整理頁面。');
    return;
  }
  sb = lib.createClient(SUPABASE_URL, SUPABASE_KEY);
  setMode('in');
  setBoot('載入中…');
  let sess = null;
  try { sess = (await sb.auth.getSession()).data.session; } catch (e) { /* 當作沒登入 */ }
  if (sess && sess.user && sess.user.email) {
    await enter(sess.user.email.split('@')[0], sess.user.id);
  } else { bootEl.hidden = true; showAuth(); }
  setInterval(() => { if (ready && !document.hidden) resync(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && ready) resync(); });
}
boot();
})();
</script>
</body></html>
