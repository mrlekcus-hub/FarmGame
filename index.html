<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>雷克斯農場</title>
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="app/manifest.webmanifest">
<link rel="apple-touch-icon" href="app/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="app/icon-192.png">
<meta name="theme-color" content="#d3efe3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="雷克斯農場">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head><body>


<div class="app">
  <header class="top">
    <h1>雷克斯農場</h1>
    <div class="stats">
      <span class="chip" id="clock">06:00</span>
      <span class="chip" id="wx">晴天</span>
      <span class="chip gold" id="gold">100 G</span>
      <span class="chip" id="who">未登入</span>
      <span class="chip" id="sn">春</span>
    </div>
  </header>

  <div class="stage">
    <canvas id="game"></canvas>
    <div class="toast" id="toast" hidden></div>
    <div class="buffbar" id="buff" hidden></div>
    <button type="button" class="cheer" id="cheer" hidden>👏 喝采</button>
    <div class="tut" id="tut" hidden></div>
    <div class="hbar" id="hbar" hidden></div>
    <div class="empop" id="emm" hidden role="dialog" aria-label="表情與動作"><div id="emcard" tabindex="-1"></div></div>
    <div id="cfeed" hidden aria-live="polite"></div>
    <div class="cbar" id="cbar" hidden role="dialog" aria-label="聊天">
      <div class="cq" id="cq"></div>
      <form id="cform" autocomplete="off">
        <input class="nameinput" id="cinput" type="text" maxlength="40" placeholder="說點什麼（/ 開啟）" enterkeyhint="send" aria-label="聊天訊息">
        <button type="submit" class="btn">送出</button>
      </form>
    </div>
    <button type="button" class="cfab" id="cfab" aria-label="聊天與表情（X）" hidden>💬</button>
    <div class="dock" id="dock" aria-label="快捷功能">
      <button type="button" class="dockbtn dockfold" id="dockfold" aria-label="收起快捷列" aria-expanded="true"><span class="di">▸</span><small>收起</small><i class="dbadge" id="foldbadge" hidden></i></button>
      <button type="button" class="dockbtn" data-k="bag" aria-label="背包（B）"><span class="di">🎒</span><small>背包</small></button>
      <button type="button" class="dockbtn" data-k="fr" aria-label="好友（F）"><span class="di">👥</span><small>好友</small><i class="dbadge" id="dockbadge" hidden></i></button>
      <button type="button" class="dockbtn" data-k="mail" aria-label="信箱（M）"><span class="di">✉️</span><small>信箱</small><i class="dbadge" id="mailbadge" hidden></i></button>
      <button type="button" class="dockbtn" data-k="dex" aria-label="圖鑑（G）"><span class="di">📖</span><small>圖鑑</small></button>
      <button type="button" class="dockbtn" data-k="quest" aria-label="每日任務（Q）"><span class="di">📋</span><small>任務</small><i class="dbadge" id="questbadge" hidden></i></button>
      <button type="button" class="dockbtn" data-k="lv" aria-label="等級"><span class="di">⭐</span><small>等級</small></button>
      <button type="button" class="dockbtn" data-k="card" aria-label="我的名片"><span class="di">📇</span><small>名片</small></button>
      <button type="button" class="dockbtn" data-k="set" aria-label="設定"><span class="di">⚙️</span><small>設定</small></button>
      <button type="button" class="dockbtn" data-k="tut" aria-label="新手教學"><span class="di">❓</span><small>教學</small></button>
    </div>
    <div class="catch" id="catch" hidden><canvas id="catch-cv" width="16" height="16"></canvas><div class="catch-t" id="catch-t"></div><div class="catch-s" id="catch-s"></div><button type="button" class="btn small" id="catch-show" hidden>展示給大家看</button></div>
    <div class="shop" id="shop" hidden><div class="card" id="shopcard" tabindex="-1"></div></div>
    <div class="fade" id="fade"></div>
  </div>

  <div class="hotbar" id="hotbar"></div>
  <div class="sidebtns"><button type="button" class="menubtn" id="bagbtn">背包</button><button type="button" class="menubtn" id="menubtn" aria-expanded="false">☰ 選單<i class="dbadge" id="menubadge" hidden></i></button></div>

  <div class="side" id="side">
  <div class="grab" id="grab"><i></i></div>
  <button type="button" class="btn ghost sideclose" id="sideclose">關閉選單 ✕</button>
  <div class="immgrid" id="immgrid">
    <button type="button" class="imi" data-k="bag"><span class="di">🎒</span>背包</button>
    <button type="button" class="imi" data-k="fr"><span class="di">👥</span>好友<i class="dbadge" id="immfb" hidden></i></button>
    <button type="button" class="imi" data-k="mail"><span class="di">✉️</span>信箱<i class="dbadge" id="immmb" hidden></i></button>
    <button type="button" class="imi" data-k="dex"><span class="di">📖</span>圖鑑</button>
    <button type="button" class="imi" data-k="quest"><span class="di">📋</span>任務<i class="dbadge" id="immqb" hidden></i></button>
    <button type="button" class="imi" data-k="lv"><span class="di">⭐</span>等級</button>
    <button type="button" class="imi" data-k="card"><span class="di">📇</span>名片</button>
    <button type="button" class="imi" data-k="set"><span class="di">⚙️</span>設定</button>
    <button type="button" class="imi" data-k="emo"><span class="di">💬</span>聊天表情</button>
    <button type="button" class="imi" data-k="tut"><span class="di">❓</span>教學</button>
  </div>
  <div class="sideL">
  <div class="tip" id="tip" aria-live="polite">走到田邊，面向一塊草地，按動作鍵。</div>

  <section class="village" id="hpanel" hidden>
    <div class="v-head">
      <b id="h-title">我的家</b>
      <span class="v-last" id="h-hint"></span>
      <button type="button" class="btn ghost" id="h-leave">回農場</button>
    </div>
    <div class="v-quick" id="h-quick">
      <button type="button" class="btn small" id="h-edit" aria-pressed="false">布置模式：關</button>
      <button type="button" class="btn small ghost" id="h-shop">牆面地板</button>
      <button type="button" class="btn small ghost" id="h-look">換造型</button>
    </div>
    <div id="h-edit-box" hidden>
      <div class="v-list" id="h-inv"></div>
      <div class="v-quick" id="h-sel" hidden></div>
    </div>
  </section>

  <div class="foot" id="foot">
    <p><span class="keys"><kbd>←↑↓→</kbd> 或 <kbd>WASD</kbd> 移動　<kbd>空白</kbd> 或 <kbd>E</kbd> 動作　<kbd>1</kbd>–<kbd>5</kbd> 換工具<br></span>翻土、播種、澆水之後，作物會依真實時間慢慢長大——就算你關掉遊戲也會繼續長。晴天要保持土壤濕潤，下雨和下雪時不用澆水也會長。站在房子門前按動作鍵可以進屋布置。</p>
    <div class="footbtns">
      <button type="button" class="btn ghost" id="gmbtn" hidden>GM 邀請碼</button>
    </div>
    </div>
  </div>
  <div class="sideR">
  <section class="village" id="village" hidden>
    <div class="v-head">
      <b id="v-title">廣場</b>
      <span class="v-count" id="v-count"></span>
      <span class="v-last" id="v-last"></span>
      <button type="button" class="btn ghost" id="v-copy" hidden>複製邀請碼</button>
      <button type="button" class="btn ghost" id="v-leave">回農場</button>
    </div>
    <div class="v-list" id="v-list"></div>
    <div class="v-log" id="v-log" aria-live="polite"></div>
    <form class="v-send" id="v-form" autocomplete="off">
      <input class="nameinput" id="v-input" type="text" maxlength="40" placeholder="對廣場上的朋友說點什麼" aria-label="聊天訊息">
      <button type="submit" class="btn">送出</button>
    </form>
    <div class="v-quick" id="v-quick"></div>
  </section>
  </div>
  </div>

  <div class="pad" id="pad">
    <div class="dpad" id="stick" role="application" aria-label="移動搖桿">
      <div class="stick-base"></div>
      <i class="stick-knob" id="knob"></i>
    </div>
    <button type="button" class="act" id="actbtn">動作</button>
  </div>

</div>

<div class="maker" id="maker" hidden>
  <div class="maker-card">
    <h2>捏出你的農夫</h2>
    <div class="maker-top">
      <div class="preview">
        <div class="pvbox"><canvas id="pv" width="16" height="22"></canvas></div>
        <button type="button" class="btn ghost" id="pvturn">轉身看看</button>
      </div>
      <div class="opts" id="opts">
        <div class="optrow" id="mk-inv-wrap" hidden>
          <label class="optlabel" for="mk-inv">邀請碼</label>
          <input class="nameinput" id="mk-inv" type="text" autocomplete="off" autocapitalize="characters" maxlength="16" placeholder="向 GM 索取">
        </div>
        <div class="optrow">
          <label class="optlabel" for="mk-name">名字</label>
          <input class="nameinput" id="mk-name" type="text" maxlength="8" autocomplete="off" placeholder="最多 8 個字">
        </div>
      </div>
    </div>
    <div class="mk-split" id="mk-split"></div>
    <p class="mk-msg" id="mk-msg" role="alert" hidden></p>
    <div class="maker-actions">
      <button type="button" class="btn ghost" id="mk-rand">隨機</button>
      <button type="button" class="btn ghost" id="mk-cancel" hidden>取消</button>
      <button type="button" class="btn" id="mk-ok">開始農場生活</button>
    </div>
  </div>
</div>

<div class="maker" id="dexm" hidden><div class="card maker-card" id="dexcard" tabindex="-1"></div></div>
<div class="maker" id="bagm" hidden><div class="card maker-card" id="bagcard" tabindex="-1"></div></div>
<div class="maker" id="sym" hidden><div class="card maker-card" id="sycard" tabindex="-1"></div></div>
<div class="maker" id="fshop" hidden><div class="card maker-card" id="fshopcard" tabindex="-1"></div></div>
<div class="maker" id="mlm" hidden><div class="card maker-card" id="mlcard" tabindex="-1"></div></div>
<div class="maker" id="frmenu" hidden><div class="card maker-card" id="frcard" tabindex="-1"></div></div>
<div class="stm" id="stm" hidden><div class="stcard" id="stcard" role="dialog" aria-label="設定" tabindex="-1">
  <h2>設定</h2>
  <div class="strow" id="st-orient-row" hidden><b>畫面方向</b>
    <div class="seg" id="st-orient"><button type="button" data-o="auto">自動</button><button type="button" data-o="portrait">直向</button><button type="button" data-o="landscape">橫向</button></div></div>
  <div class="strow"><b>音樂</b><button type="button" class="btn ghost small" id="music" aria-pressed="true">音樂：開</button></div>
  <div class="strow"><b>音量</b><input type="range" id="vol" min="0" max="100" value="50" aria-label="音量" style="flex:1;min-width:0;accent-color:var(--pink)"></div>
  <div class="strow" id="st-fs-row"><b>全螢幕</b><button type="button" class="btn ghost small" id="fs" hidden>全螢幕</button></div>
  <div class="strow"><b>門鈴通知</b><button type="button" class="btn ghost small" id="st-bell" aria-pressed="true">開</button></div>
  <div class="strow"><b>謝絕訪客</b><button type="button" class="btn ghost small" id="st-closed" aria-pressed="false">關</button></div>
  <div class="strow"><b>禁止拜訪</b><button type="button" class="btn ghost small" id="st-blk-btn">名單</button></div>
  <div id="st-blk" hidden style="margin:-4px 0 8px"></div>
  <div class="strow" id="st-app-row"><b>App 版本</b><button type="button" class="btn ghost small" id="appinst">下載 App</button></div>
  <small class="empty" id="app-hint" hidden style="display:block;margin:-4px 0 8px;line-height:1.6"></small>
  <button type="button" class="btn ghost wide" id="logout">登出</button>
  <button type="button" class="btn wide" id="st-close">完成</button>
</div></div>
<div class="maker" id="dtm" hidden><div class="card maker-card" id="dtcard" tabindex="-1"></div></div>
<div class="maker" id="pnm" hidden role="dialog" aria-label="鋼琴"><div class="card maker-card pn-card" id="pncard" tabindex="-1"></div></div>
<div class="stm" id="trm" hidden><div class="stcard trcard" id="trcard" role="dialog" aria-label="塔羅小攤" tabindex="-1"></div></div>
<div class="maker" id="vmenu" hidden><div class="card maker-card" id="vmcard" tabindex="-1"></div></div>
<div class="maker" id="qm" hidden><div class="card maker-card" id="qcard" tabindex="-1"></div></div>
<div id="lvup" class="lvup" hidden></div>
<div class="maker" id="lvm" hidden><div class="card maker-card" id="lvcard" tabindex="-1"></div></div>
<div class="maker" id="cdm" hidden><div class="card maker-card" id="cdcard" tabindex="-1"></div></div>
<div class="maker" id="gm" hidden><div class="card maker-card" id="gmcard" tabindex="-1"></div></div>
<div class="maker" id="dsm" hidden><div class="card maker-card" id="dscard" tabindex="-1"></div></div>
<div class="maker" id="bdm" hidden><div class="card maker-card" id="bdcard" tabindex="-1"></div></div>
<div class="maker" id="ckm" hidden><div class="card maker-card" id="ckcard" tabindex="-1"></div></div>
<div class="maker" id="dgm" hidden><div class="card maker-card" id="dgcard" tabindex="-1"></div></div>
<div class="maker" id="rcm" hidden><div class="card maker-card" id="rccard" tabindex="-1"></div></div>
<div class="maker" id="mcm" hidden><div class="card maker-card" id="mccard" tabindex="-1"></div></div>
<div class="maker" id="lkm" hidden><div class="card maker-card" id="lkcard" tabindex="-1"></div></div>

<div class="maker" id="auth" hidden>
  <canvas id="cover" aria-hidden="true"></canvas><div id="cover-nm" aria-hidden="true" hidden></div>
  <form class="maker-card auth-card" id="auth-form" autocomplete="on">
    <h2>雷克斯農場</h2>
    <p class="auth-note" id="au-greet"></p>
    <div class="tabs" role="tablist">
      <button type="button" class="cb" id="tab-in" aria-pressed="true">登入</button>
      <button type="button" class="cb" id="tab-up" aria-pressed="false">註冊新帳號</button>
    </div>
    <label>帳號<input class="nameinput" id="au-user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="16" placeholder="3–16 個小寫英文字母、數字或底線"></label>
    <label id="au-code-wrap" hidden>邀請碼<input class="nameinput" id="au-code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="16" placeholder="向 GM 索取，例如 A1B2C3D4E5"></label>
    <label>密碼<input class="nameinput" id="au-pass" type="password" autocomplete="current-password" maxlength="64" placeholder="至少 6 個字元"></label>
    <p class="auth-msg" id="au-msg" aria-live="polite"></p>
    <button type="submit" class="btn" id="au-go">登入</button>
    <p class="auth-note">這是獨立的農場帳號，和其他遊戲不通用。請記住密碼，目前沒有找回密碼功能。</p>
  </form>
</div>

<div class="maker" id="boot" hidden><div class="maker-card"><h2 id="boot-t">載入中…</h2><p class="auth-note" id="boot-m"></p></div></div>

</body></html>
