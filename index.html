<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>雷克斯農場</title>
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="app/manifest.webmanifest">
<link rel="apple-touch-icon" href="app/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="app/icon-192.png">
<meta name="theme-color" content="#d3efe3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="雷克斯農場">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：單欄遊戲機。上方圓角狀態列，中間粉彩農場畫布，下方工具列；手機另有十字鍵與動作鈕。 */
:root{
  --ground:#d3efe3;
  --panel:#fffaf0;
  --edge:#f3c3a6;
  --ink:#6b4848;
  --muted:#a07f7a;
  --pink:#ff8fa8;
  --pink-deep:#e26b88;
  --sun:#ffc857;
  --sun-deep:#e0a12e;
  --sky:#5fb8e6;
  --leaf:#7fd08a;
  --f-display:'Chiron GoRound TC','Noto Sans TC',system-ui,sans-serif;
  --f-body:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--f-body);
  padding-block:14px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.top h1{margin:0;font:800 26px/1.1 var(--f-display);letter-spacing:.08em;color:var(--pink-deep);text-shadow:0 2px 0 #fff,0 0 0 #fff;text-wrap:balance}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font:600 14px/1 var(--f-display);
  background:var(--panel);color:var(--ink);
  padding:8px 13px;border-radius:999px;
  border:2px solid var(--edge);
  box-shadow:0 3px 0 var(--edge);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.chip.gold{color:#b9791a;border-color:var(--sun);box-shadow:0 3px 0 var(--sun-deep)}
.chip.late{color:#fff;background:var(--pink);border-color:var(--pink-deep);box-shadow:0 3px 0 var(--pink-deep)}
.chip.rain{color:#fff;background:var(--sky);border-color:#3f98c8;box-shadow:0 3px 0 #3f98c8}
.stage{position:relative;line-height:0;background:#a8dc7a;border-radius:22px;overflow:hidden;border:5px solid #fff;box-shadow:0 5px 0 var(--edge),0 10px 18px rgba(107,72,72,.16)}
canvas#game{display:block;width:100%;height:auto;aspect-ratio:10/7;image-rendering:pixelated}
.toast{
  position:absolute;left:50%;top:10px;transform:translateX(-50%);
  max-width:92%;line-height:1.5;font-size:13px;font-weight:500;text-align:center;
  background:var(--panel);color:var(--ink);border:3px solid var(--pink);border-radius:16px;
  padding:7px 14px;pointer-events:none;box-shadow:0 3px 0 var(--pink-deep);
}
.codebox{font:600 15px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;color:var(--ink)}
.gmrow{display:flex;gap:8px;align-items:center}
.gmrow .nameinput{flex:1;min-width:0;padding:8px 12px}
.gmrow .num{width:70px;padding:8px 10px}
.btn.small{min-height:32px;padding:7px 12px;font-size:12px}
.vline.sys{color:var(--muted)}
.swatch{display:inline-block;width:22px;height:22px;border-radius:7px;border:2px solid var(--edge);flex:none}
.tabs2{display:flex;gap:6px}
.tabs2 .cb{flex:1;padding:9px 4px}
.chipbtn{font:600 13px/1 var(--f-display);color:var(--ink);background:#fff;border:2px solid var(--edge);border-radius:999px;padding:8px 12px;cursor:pointer}
.chipbtn[aria-pressed=true]{background:var(--pink);color:#fff;border-color:var(--pink-deep)}
canvas#game.editing{cursor:crosshair}
.tip{background:var(--panel);border:2px solid var(--edge);border-radius:14px;padding:8px 14px;font-size:14px;line-height:1.5;min-height:40px}
.auth-card .tabs{display:flex;gap:8px}
.auth-card .tabs .cb{flex:1;padding:11px}
.auth-card label{display:flex;flex-direction:column;gap:6px;font:600 12px/1 var(--f-display);letter-spacing:.14em;color:var(--muted)}
.auth-msg{margin:0;min-height:20px;font-size:13px;line-height:1.5;color:var(--pink-deep);text-align:center}
.auth-note{margin:0;font-size:12px;line-height:1.6;color:var(--muted);text-align:center}
.fade{position:absolute;inset:0;background:#2b2140;opacity:0;pointer-events:none;transition:opacity .6s}
.fade.on{opacity:1}
.shop{position:absolute;inset:0;background:rgba(80,50,60,.45);display:flex;align-items:center;justify-content:center;padding:10px;line-height:1.4}
.card{
  width:min(500px,100%);max-height:100%;overflow:auto;
  background:var(--panel);padding:16px;border-radius:20px;border:4px solid var(--edge);
  display:flex;flex-direction:column;gap:8px;color:var(--ink);
}
.card:focus{outline:none}
.shop-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card h2{margin:0;font:800 21px/1.2 var(--f-display);color:var(--pink-deep);letter-spacing:.08em}
.card h3{margin:6px 0 0;font:600 12px/1 var(--f-display);letter-spacing:.14em;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:2px dotted var(--edge)}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.meta b{font-weight:700;font-size:14px}
.meta small{color:var(--muted);font-size:12px}
.qty{display:flex;align-items:center;gap:4px;margin-top:3px}
.qty button{min-width:28px;height:26px;padding:0 8px;border:2px solid var(--edge);border-radius:8px;background:#fff;color:var(--ink);font:700 13px/1 var(--f-body);cursor:pointer}
.qty button:disabled{opacity:.4;cursor:default}
.qty output{min-width:30px;text-align:center;font:700 14px/1 var(--f-body);color:var(--ink)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--c,#fff);box-shadow:inset -2px -2px 0 rgba(0,0,0,.14);flex:none}
.empty{margin:4px 0;color:var(--muted);font-size:13px}
.btn{
  font:600 14px/1 var(--f-display);color:#fff;background:var(--pink);
  border:0;padding:10px 16px;min-height:40px;cursor:pointer;border-radius:999px;
  box-shadow:0 4px 0 var(--pink-deep);
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pink-deep)}
.btn[disabled]{background:#d9cbc4;color:#fff;box-shadow:0 4px 0 #bdada5;cursor:not-allowed}
.btn.wide{width:100%;margin-top:8px}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--edge);box-shadow:0 4px 0 var(--edge)}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.hotbar{display:flex;flex-wrap:wrap;gap:8px}
.slot{
  position:relative;width:60px;height:60px;padding:0;cursor:pointer;color:var(--ink);
  background:var(--panel);border:3px solid var(--edge);border-radius:16px;
  box-shadow:0 4px 0 var(--edge);
}
.slot canvas{width:36px;height:36px;image-rendering:pixelated;position:absolute;left:10px;top:7px}
.slot .k{position:absolute;left:6px;top:3px;font:600 10px/1 var(--f-display);color:var(--muted)}
.slot .n{position:absolute;right:5px;bottom:3px;font:600 10px/1 var(--f-display);font-variant-numeric:tabular-nums}
.slot.sel{border-color:var(--pink);box-shadow:0 4px 0 var(--pink-deep);background:#fff0f3}
.slot.empty canvas{opacity:.35}
.slot.hbpage{border-style:dashed;background:var(--ground)}
.slot.hbpage .pgn{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font:800 22px/1 var(--f-display);color:var(--ink)}
.slot.hbpage .pgn small{font-size:11px;font-weight:600;color:var(--muted);margin-left:1px}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.bag{display:flex;flex-wrap:wrap;gap:6px}
.bagchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:7px 11px;background:var(--panel);border:2px solid var(--edge);border-radius:999px;font-variant-numeric:tabular-nums}
.pad{display:none;align-items:center;justify-content:space-between;gap:16px;padding:4px 4px 8px;touch-action:none;user-select:none;-webkit-user-select:none}
/* 類比搖桿：底盤 + 可拖動的圓鈕 */
.dpad{display:block;--sz:168px;width:var(--sz);height:var(--sz);flex:none}
.stick-base{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 50% 45%,#fff 0,var(--panel) 62%,#f6e3d3 100%);
  border:4px solid var(--edge);box-shadow:0 5px 0 var(--edge),inset 0 0 0 10px rgba(255,200,170,.18)}
.stick-knob{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;
  background:var(--pink);border:3px solid var(--pink-deep);
  box-shadow:0 4px 0 var(--pink-deep),inset 0 -5px 0 rgba(0,0,0,.06);will-change:transform}
.dpad.on .stick-knob{background:#ff7a9b}
.dpad button{
  background:var(--panel);color:var(--pink-deep);border:3px solid var(--edge);font:800 18px/1 var(--f-display);border-radius:18px;touch-action:none;
  box-shadow:0 4px 0 var(--edge);
}
.dpad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.dpad [data-d=up]{grid-column:2;grid-row:1}
.dpad [data-d=left]{grid-column:1;grid-row:2}
.dpad [data-d=right]{grid-column:3;grid-row:2}
.dpad [data-d=down]{grid-column:2;grid-row:3}
.act{
  width:100px;height:100px;border-radius:50%;border:0;touch-action:none;
  font:800 20px/1 var(--f-display);color:#fff;background:var(--pink);
  box-shadow:0 6px 0 var(--pink-deep),inset 0 -6px 0 rgba(0,0,0,.06);
}
.act:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pink-deep)}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;color:var(--muted);font-size:13px;line-height:1.7}
.foot p{margin:0;min-width:0}
kbd{font:600 12px/1 var(--f-display);color:var(--ink);background:var(--panel);padding:3px 7px;border-radius:7px;border:2px solid var(--edge)}
.foot .btn{min-height:34px;padding:8px 13px;font-size:12px}
.footbtns{display:flex;flex-wrap:wrap;gap:8px}
.village{background:var(--panel);border:3px solid var(--edge);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 0 var(--edge)}
.v-head{display:flex;align-items:center;gap:10px;min-width:0}
.v-head b{font:800 16px/1 var(--f-display);color:var(--pink-deep);letter-spacing:.08em;flex:none}
.v-count{font:600 12px/1 var(--f-display);color:var(--muted);flex:none}
.v-last{flex:1;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-head .btn{min-height:30px;padding:6px 11px;font-size:12px;flex:none}
.v-body{display:flex;flex-direction:column;gap:10px}
.v-list{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted);line-height:1.6}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 10px;border-radius:999px;background:#fff;border:2px solid var(--edge);font-size:13px;font-weight:500;color:var(--ink)}
.tbtn{font:600 12px/1 var(--f-display);color:#fff;background:var(--sky);border:0;border-radius:999px;padding:6px 10px;cursor:pointer;box-shadow:0 2px 0 #3f98c8}
.v-log{height:104px;overflow:auto;background:#fff;border:2px solid var(--edge);border-radius:14px;padding:8px 10px;font-size:13px;line-height:1.55;overflow-wrap:anywhere}
.vline b{color:var(--pink-deep);font-weight:700}
.vline.me b{color:#3f98c8}
.v-send{display:flex;gap:8px}
.v-send .nameinput{flex:1;min-width:0}
.v-quick{display:flex;flex-wrap:wrap;gap:6px}
.qbtn{font:600 13px/1 var(--f-display);color:var(--ink);background:#fff;border:2px solid var(--edge);border-radius:999px;padding:8px 12px;cursor:pointer}
.qbtn:active{transform:translateY(1px)}
.trrow{display:flex;gap:8px}
.sel{flex:1;min-width:0;font:500 15px/1.2 var(--f-body);color:var(--ink);background:#fff;border:3px solid var(--edge);border-radius:14px;padding:10px 12px}
.num{width:92px;font:500 15px/1.2 var(--f-body);color:var(--ink);background:#fff;border:3px solid var(--edge);border-radius:14px;padding:10px 12px}
.offer{background:#fff;border:2px dashed var(--edge);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.offer p{margin:0}
.tmsg{margin:0;font-size:15px;line-height:1.6;text-align:center}
.stm{position:fixed;inset:0;z-index:31;display:flex;padding:16px;background:rgba(107,72,72,.35);overflow:auto}
.stm[hidden]{display:none}
.stcard{width:min(340px,100%);margin:auto;background:var(--panel);border:4px solid var(--edge);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 5px 0 var(--edge)}
.stcard h2{margin:0;text-align:center;font:800 20px/1.2 var(--f-display);color:var(--pink-deep);letter-spacing:.08em}
.strow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.strow>b{font:700 14px/1.2 var(--f-display);color:var(--ink);flex:none}
.seg{display:flex;border:2px solid var(--edge);border-radius:999px;overflow:hidden;background:#fff}
.seg button{font:600 13px/1 var(--f-display);color:var(--ink);background:transparent;border:0;padding:8px 12px;cursor:pointer}
.seg button+button{border-left:2px solid var(--edge)}
.seg button.on{background:var(--pink);color:#fff}
.maker{
  position:fixed;inset:0;z-index:30;overflow:auto;background:var(--ground);display:flex;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.maker-card{
  width:min(580px,100%);margin:auto;background:var(--panel);border:4px solid var(--edge);border-radius:26px;
  padding:18px;display:flex;flex-direction:column;gap:16px;box-shadow:0 6px 0 var(--edge);
}
.maker-card h2{margin:0;text-align:center;font:800 24px/1.2 var(--f-display);color:var(--pink-deep);letter-spacing:.08em}
.maker-top{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
.preview{flex:none;display:flex;flex-direction:column;align-items:center;gap:10px}
.pvbox{width:156px;height:204px;display:grid;place-items:center;background:#bfe9a8;border:4px solid #fff;border-radius:22px;box-shadow:0 0 0 3px var(--edge)}
.pvbox canvas{width:128px;height:176px;image-rendering:pixelated}
.opts{flex:1 1 250px;min-width:0;display:flex;flex-direction:column;gap:12px}
.optrow{display:flex;flex-direction:column;gap:6px}
.optlabel{font:600 12px/1 var(--f-display);letter-spacing:.14em;color:var(--muted)}
.sws,.chips{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;padding:0;border-radius:50%;border:3px solid #fff;background:var(--c);box-shadow:0 0 0 2px var(--edge);cursor:pointer}
.sw[aria-pressed=true]{box-shadow:0 0 0 4px var(--pink-deep);transform:scale(1.08)}
.cb{font:600 13px/1 var(--f-display);padding:9px 13px;border-radius:999px;border:2px solid var(--edge);background:#fff;color:var(--ink);cursor:pointer}
.cb[aria-pressed=true]{background:var(--pink);color:#fff;border-color:var(--pink-deep)}
.nameinput{font:500 15px/1.2 var(--f-body);color:var(--ink);background:#fff;border:3px solid var(--edge);border-radius:14px;padding:10px 14px;width:100%;min-width:0}
.nameinput:focus{outline:3px solid var(--sky);outline-offset:1px}
.fdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#cbbdb4;margin-right:6px;vertical-align:baseline}
.fdot.on{background:#5fcf80}
.frow{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 0;border-bottom:2px dashed var(--edge)}
.frow .meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.frow small{color:#8a6a6a;font-size:13px}
.frow .acts{display:flex;gap:6px;flex-shrink:0}
.mk-msg{margin:0;text-align:center;font-size:15px;font-weight:700;line-height:1.5;color:#b3374f;background:#fff0f2;border:2px solid #f2a7b4;border-radius:14px;padding:8px 12px}
.maker-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
@media (pointer:coarse),(max-width:700px){
  .pad{display:flex}
  .keys{display:none}
}
@media (prefers-reduced-motion:reduce){.fade{transition:none}}


/* ---- 新手教學卡 ---- */
.tut{position:absolute;left:8px;bottom:8px;z-index:3;width:min(320px,calc(100% - 78px));line-height:1.5;
  background:rgba(255,250,240,.96);border:3px solid var(--pink);border-radius:16px;box-shadow:0 3px 0 var(--pink-deep);padding:8px 12px 9px;color:var(--ink);font-size:13px}
.tut p{margin:2px 0 6px;font-size:13px}
.tut-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font:600 11px/1 var(--f-display);color:var(--muted)}
.tut-t{font:800 16px/1.3 var(--f-display);color:var(--pink-deep);letter-spacing:.06em;margin-top:2px}
.tut-b{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tut-wait{font-size:11px;color:var(--muted)}
.tutx{font:600 11px/1 var(--f-display);color:var(--muted);background:none;border:0;padding:4px 0 4px 8px;cursor:pointer;text-decoration:underline}
@media (max-width:520px){.tut{left:5px;bottom:5px;width:calc(100% - 62px);padding:6px 10px 7px}.tut p{font-size:12px}.tut-t{font-size:14px}}
@media (orientation:landscape) and (max-height:560px){.tut{width:min(290px,calc(100% - 90px));padding:5px 9px 6px}.tut p{font-size:11px;margin:1px 0 4px}.tut-t{font-size:13px}}
/* ---- 快捷列 ---- */
.empop{position:absolute;right:8px;bottom:56px;z-index:4;width:196px;max-width:calc(100% - 16px);padding:7px;line-height:1.2;background:rgba(255,250,240,.97);
  border:3px solid var(--edge);border-radius:14px;box-shadow:0 3px 0 var(--edge)}
.empop[hidden]{display:none}
.empop .eg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.empop .eg+.eg{margin-top:5px;padding-top:5px;border-top:2px dashed #e8d3bf;grid-template-columns:repeat(5,1fr)}
.empop button{font:inherit;font-size:19px;line-height:1;padding:5px 0;background:#fff;border:2px solid var(--edge);border-radius:10px;cursor:pointer}
.empop button:active{transform:translateY(1px);background:#fde9c9}
.empop button:focus-visible{outline:2px solid #e8833a}
@media (max-width:520px){.empop{right:5px;bottom:48px;width:178px}.empop button{font-size:17px}}
.dock{position:absolute;right:8px;top:8px;z-index:3;display:flex;flex-direction:column;gap:6px;line-height:1}
.dockbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;width:52px;padding:6px 0 5px;cursor:pointer;
  color:var(--ink);background:rgba(255,250,240,.94);border:3px solid var(--edge);border-radius:16px;box-shadow:0 3px 0 var(--edge);-webkit-user-select:none;user-select:none}
.dockfold{padding:3px 0;gap:0;opacity:.8}.dockfold .di{font-size:14px}
.dock.folded .dockbtn:not(.dockfold){display:none}
.dock.folded .dockfold{width:34px;padding:6px 0;border-radius:12px}
.dock.folded .dockfold small{display:none}
.dockbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.dockbtn .di{font-size:20px;line-height:1}
.dockbtn small{font:600 10px/1 var(--f-display);color:var(--muted)}
.mltabs{display:flex;gap:8px;margin:6px 0}.mllab{display:block;font-weight:800;margin:10px 0 4px}
.mlgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}

.lvup{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:rgba(60,40,40,.45);cursor:pointer}

@keyframes lvuPop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

const DEF_CHAR = { name: '小農夫', gender: 0, skin: 0, hair: 0, style: 0, hat: 3, hatc: 0, outfit: 0, fits: 0 };
const shade = (h, f) => {
  const n = parseInt(h.slice(1), 16);
  return '#' + [16, 8, 0].map(i => Math.max(0, Math.min(255, Math.round(((n >> i) & 255) * f))).toString(16).padStart(2, '0')).join('');
};
function drawBody(x, y, face, ch, skin, fit, fitO) {

  const bx = m ? x + 3 : x + 4, bw = m ? 10 : 8;
  const side = face === 'left' || face === 'right', back = face === 'up', front = face === 'down';
  if (fs === 2) {                                   // 洋裝
    ob(fit, fitO, x + 4, y + 10, 8, 3);

    r('#ffffff', x + 3, y + 15, 10, 1);
    if (front) { r('#ffffff', x + 6, y + 10, 4, 1); r(shade(fit, 1.2), x + 7, y + 13, 2, 1); }
  } else if (fs === 1) {                            // 吊帶褲
    ob('#fffaf0', '#e6d7c3', bx, y + 10, bw, 5);
    r(fit, bx + 1, y + 12, bw - 2, 3);
    if (!side) { r(fit, bx + 1, y + 10, 2, 3); r(fit, bx + bw - 3, y + 10, 2, 3); }
    if (front) { r('#ffd27a', bx + 1, y + 12, 1, 1); r('#ffd27a', bx + bw - 2, y + 12, 1, 1); }
  } else if (fs === 3) {                            // 外套
    ob(fit, fitO, bx, y + 10, bw, 5);
    r(shade(fit, 1.18), bx, y + 10, bw, 1);
    if (front) { r('#fffaf0', x + 7, y + 11, 2, 4); r(fitO, x + 7, y + 11, 1, 4); r('#ffd27a', x + 8, y + 12, 1, 1); }
  } else if (fs === 4) {                            // 圍裙
    ob('#fff3e0', '#e6cfae', bx, y + 10, bw, 5);
    if (front) { r(fit, x + 5, y + 11, 6, 4); r(fit, x + 6, y + 10, 1, 1); r(fit, x + 9, y + 10, 1, 1); r(shade(fit, 0.8), x + 6, y + 13, 4, 1); }
    else if (back) { r(fit, x + 6, y + 12, 4, 2); r(fit, x + 5, y + 13, 1, 2); r(fit, x + 10, y + 13, 1, 2); }
    else r(fit, x + 6, y + 11, 4, 4);
  } else if (fs === 5) {                            // 連帽衫
    ob(fit, fitO, bx, y + 10, bw, 5);
    r(shade(fit, 0.85), bx + 1, y + 10, bw - 2, 2);
    if (front) { r('#ffffff', x + 6, y + 12, 1, 2); r('#ffffff', x + 9, y + 12, 1, 2); r(shade(fit, 0.88), x + 6, y + 14, 4, 1); }
  } else if (fs === 6) {                            // 水手服
    ob('#ffffff', '#d8d0c4', bx, y + 10, bw, 5);
    if (front) { r(fit, x + 5, y + 10, 6, 2); r('#ff6b8a', x + 7, y + 12, 2, 1); }
    else r(fit, bx, y + 10, bw, 2);
  } else if (fs === 7) {                            // 針織毛衣
    ob(fit, fitO, bx, y + 10, bw, 5);
    r(shade(fit, 1.25), bx + 1, y + 10, bw - 2, 1); r(shade(fit, 1.25), bx, y + 12, bw, 1); r(shade(fit, 0.85), bx, y + 14, bw, 1);
  } else if (fs === 8) {                            // 晚宴長裙
    ob(fit, fitO, x + 4, y + 10, 8, 3);
    ob(fit, fitO, x + 2, y + 12, 12, 4);
    r('#ffd27a', x + 2, y + 15, 12, 1);
    if (front) { r('#ffd27a', x + 6, y + 12, 4, 1); r('#ffffff', x + 4, y + 13, 1, 1); r('#ffffff', x + 11, y + 14, 1, 1); }
  } else {                                          // T 恤
    ob(fit, fitO, bx, y + 10, bw, 5);
    r('#ffffff', x + 6, y + 10, 4, 2);
  }
  if (side) r(skin, x + 7, y + 12, 2, 2);
  else { r(skin, m ? x + 2 : x + 3, y + 12, 1, 2); r(skin, m ? x + 13 : x + 12, y + 12, 1, 2); }
}
function drawPlayer(px, py, face, moving, phase, ch) {
  ch = ch || DEF_CHAR;
  const skin = SKINS[ch.skin] || SKINS[0], skinO = shade(skin, 0.82);
  const hair = HAIRS[ch.hair] || HAIRS[0], hairO = shade(hair, 0.78);
  const fit = OUTFITS[ch.outfit] || OUTFITS[0], fitO = shade(fit, 0.8);
  const hc = HATCOL[ch.hatc] || HATCOL[0], hco = shade(hc, 0.82);

  const side = face === 'left' || face === 'right', st_ = ch.style | 0, male = ch.gender === 1;
  const legc = male && ![2, 8].includes(ch.fits | 0) ? '#6d7fa8' : '#8a5a44';
  r('rgba(107,72,72,.22)', px + 3, py + 13, 10, 2);
  r(legc, px + 5, yb + 13, 2, 3 - (moving && phase ? 1 : 0));
  r(legc, px + 9, yb + 13, 2, 3 - (moving && !phase ? 1 : 0));
  r('#8a5a44', px + 5, yb + 15, 2, 1); r('#8a5a44', px + 9, yb + 15, 2, 1);
  drawBody(x, y, face, ch, skin, fit, fitO);
  /* 頭後面的頭髮（先畫，頭會蓋在上面） */
  if (st_ === 7) ob(hair, hairO, x, y, 16, 10);
  if (st_ === 11) { ob(hair, hairO, x + 1, y - 1, 5, 5); ob(hair, hairO, x + 10, y - 1, 5, 5); }
  if (st_ === 12 && face !== 'up') { ob(hair, hairO, x, y + 4, 16, 10); r(hairO, x + 2, y + 9, 1, 3); r(hairO, x + 13, y + 9, 1, 3); }
  if (st_ === 13) {
    (face === 'down' || face === 'up' ? [x, x + 13] : face === 'left' ? [x + 12] : [x + 1]).forEach(b_ => {
      ob(hair, hairO, b_, y + 5, 3, 9); r(hairO, b_, y + 8, 3, 1); r(hairO, b_, y + 11, 3, 1); r('#ff8fa8', b_, y + 13, 3, 1);
    });
  }
  if (st_ === 1) {
    if (face === 'down' || face === 'up' || face === 'right') { ob(hair, hairO, x, y + 5, 3, 7); r('#ff8fa8', x, y + 6, 3, 1); }
    if (face === 'down' || face === 'up' || face === 'left') { ob(hair, hairO, x + 13, y + 5, 3, 7); r('#ff8fa8', x + 13, y + 6, 3, 1); }
  } else if ((st_ === 2 || st_ === 9) && face !== 'up') {
    ob(hair, hairO, x + 1, y + 5, 14, 8);
  } else if (st_ === 5 && face !== 'up') {
    ob(hair, hairO, x + 1, y + 5, 14, 6);
  } else if (st_ === 4) {
    if (face === 'down') { ob(hair, hairO, x + 12, y + 4, 4, 9); r('#ff8fa8', x + 12, y + 5, 4, 1); }
    else if (face === 'left') ob(hair, hairO, x + 11, y + 5, 4, 8);
    else if (face === 'right') ob(hair, hairO, x + 1, y + 5, 4, 8);
  } else if (st_ === 6) {
    const bxp = face === 'down' ? x : (face === 'left' ? x + 12 : (face === 'right' ? x + 1 : -99));
    if (bxp > -99) {
      ob(hair, hairO, bxp, y + 5, 3, 9);
      r(hairO, bxp, y + 8, 3, 1); r(hairO, bxp, y + 11, 3, 1); r('#ff8fa8', bxp, y + 13, 3, 1);
    }
  }
  /* 頭 */
  if (face === 'up') {
    ob(hair, hairO, x + 2, y + 3, 12, 9);
    if (st_ === 2 || st_ === 9) ob(hair, hairO, x + 2, y + 9, 12, 5);
    if (st_ === 5) ob(hair, hairO, x + 1, y + 7, 14, 5);
    if (st_ === 12) { ob(hair, hairO, x + 1, y + 9, 14, 6); r(hairO, x + 4, y + 12, 1, 3); r(hairO, x + 11, y + 12, 1, 3); }
    if (st_ === 4) { ob(hair, hairO, x + 6, y + 9, 4, 7); r('#ff8fa8', x + 6, y + 10, 4, 1); }
    if (st_ === 6) { ob(hair, hairO, x + 6, y + 9, 4, 7); r(hairO, x + 6, y + 12, 4, 1); r('#ff8fa8', x + 6, y + 15, 4, 1); }
  } else {
    ob(skin, skinO, x + 2, y + 3, 12, 9);
    if (face === 'down') {
      r(hair, x + 3, y + 4, 10, 2); r(hair, x + 3, y + 6, 1, 3); r(hair, x + 12, y + 6, 1, 3);
      if (st_ === 9) { r(hair, x + 3, y + 6, 2, 5); r(hair, x + 11, y + 6, 2, 5); r(hair, x + 3, y + 6, 10, 1); }
      if (st_ === 10) { r(skin, x + 3, y + 5, 10, 1); r(skin, x + 3, y + 6, 1, 3); r(skin, x + 12, y + 6, 1, 3); }
      r('#4a2c2c', x + 5, y + 7, 2, 2); r('#4a2c2c', x + 9, y + 7, 2, 2);
      r('#ffffff', x + 5, y + 7, 1, 1); r('#ffffff', x + 9, y + 7, 1, 1);

      r('#4a2c2c', x + 4, y + 7, 2, 2); r('#ffffff', x + 4, y + 7, 1, 1);

      r('#4a2c2c', x + 10, y + 7, 2, 2); r('#ffffff', x + 10, y + 7, 1, 1);
      if (male) r(hairO, x + 10, y + 6, 2, 1);
      r('#ffa0b0', x + 11, y + 9, 2, 1); r('#c46a6a', x + 8, y + 10, 2, 1);
    }
  }
  /* 頭頂的造型：丸子頭、刺刺髮 */
  if (st_ === 3) { ob(hair, hairO, x + 5, y - 3, 6, 5); r(shade(hair, 1.25), x + 6, y - 2, 2, 1); }
  if (st_ === 8) {
    r(hair, x + 3, y + 1, 2, 3); r(hair, x + 7, y, 2, 4); r(hair, x + 11, y + 1, 2, 3);
    r(hairO, x + 3, y + 3, 2, 1); r(hairO, x + 7, y + 3, 2, 1); r(hairO, x + 11, y + 3, 2, 1);
    r(shade(hair, 1.25), x + 7, y, 1, 1);
  }
  /* 帽子與髮飾 */
  if (ch.hat === 0) {
    ob(hc, hco, x + 4, y - 1, 8, 5);
    ob(hc, hco, x, y + 2, 16, 3);
    r(band, x + 5, y + 2, 6, 1);
    r(band, x + 11, y, 2, 2); r('#ffffff', x + 12, y, 1, 1);
  } else if (ch.hat === 1) {
    r(hco, x + 4, y, 1, 1); r(hco, x + 3, y + 1, 3, 1); r(hco, x + 2, y + 2, 5, 2);
    r(hc, x + 4, y + 1, 1, 1); r(hc, x + 3, y + 2, 3, 2); r('#ffc2d2', x + 4, y + 2, 1, 2);
    r(hco, x + 11, y, 1, 1); r(hco, x + 10, y + 1, 3, 1); r(hco, x + 9, y + 2, 5, 2);
    r(hc, x + 11, y + 1, 1, 1); r(hc, x + 10, y + 2, 3, 2); r('#ffc2d2', x + 11, y + 2, 1, 2);
    r(hc, x + 4, y + 3, 8, 1);
  } else if (ch.hat === 2) {
    ob(hc, hco, x + 8, y + 1, 4, 5); ob(hc, hco, x + 12, y + 1, 4, 5);
    r(hco, x + 11, y + 3, 2, 2); r('#ffffff', x + 9, y + 2, 1, 1);
  }
}

  catfish:  { rx: 5.5, ry: 3,   body: '#6c6a80', belly: '#a8a6bd', fin: '#55536a', out: '#3c3a52', whisk: true },
  sunfish:  { rx: 4.8, ry: 4.8, body: '#ffcf4a', belly: '#fff0a6', fin: '#f0a020', out: '#b8741a', spot: [[11, 9, '#ff6b4a'], [11, 10, '#ff6b4a']] },
  eel:      { rx: 7,   ry: 1.6, body: '#5a7a6a', belly: '#a6c4a6', fin: '#46604f', out: '#2f4538', shape: 'eel' },
  koi:      { rx: 5.5, ry: 3.4, body: '#fff6ee', belly: '#ffffff', fin: '#ffd9cf', out: '#c89a8a', spot: [[5, 6, '#ff6b4a'], [6, 6, '#ff6b4a'], [6, 7, '#ff6b4a'], [9, 8, '#ff6b4a'], [10, 8, '#ff6b4a'], [8, 6, '#2b2b2b'], [9, 6, '#2b2b2b']] },
  rainbow:  { rx: 5.5, ry: 3.4, body: '#8fd3ff', belly: '#ffffff', fin: '#c9a8ff', out: '#5a8fc0', stripe: [[4, 6, '#ff8fa8'], [5, 6, '#ff8fa8'], [6, 6, '#ffd27a'], [7, 6, '#ffd27a'], [8, 6, '#8fe09a'], [9, 6, '#8fe09a'], [10, 6, '#b79cff'], [4, 9, '#ffd27a'], [6, 9, '#8fe09a'], [8, 9, '#8fd3ff'], [10, 9, '#ff8fa8']] },
  moonfish: { rx: 5,   ry: 4.4, body: '#dfe6ff', belly: '#ffffff', fin: '#b6c4ff', out: '#7a86c8', spot: [[6, 7, '#fff6a8'], [9, 6, '#fff6a8'], [8, 10, '#fff6a8']] },
  boot:     { shape: 'boot' }
};
function drawFish(c2d, key, dim) {
  g = c2d; g.clearRect(0, 0, 16, 16);
  const A = FISH_ART[key];
  if (!A) { g = ctx; return; }
  const col = (c) => dim ? '#cdbfb8' : c;
  if (A.shape === 'boot') {
    ob(col('#a87a52'), dim ? '#a89a92' : '#6a4630', 5, 2, 5, 8);
    ob(col('#a87a52'), dim ? '#a89a92' : '#6a4630', 5, 8, 9, 5);
    r(col('#5a3a28'), 5, 12, 9, 1); r(col('#d9c7a8'), 6, 4, 3, 1); r(col('#d9c7a8'), 6, 6, 3, 1);
    g = ctx; return;
  }
  const cx = 8.5, cy = 8, eel = A.shape === 'eel';
  const wv = x => eel ? Math.sin(x * 0.75) * 1.7 : 0;
  const tail = (x, y) => {
    const k = (cx - A.rx) - x;
    if (k < -1 || k > 3) return false;
    return Math.abs(y + 0.5 - cy - wv(x)) <= (eel ? 1 : 0.7 + k * 0.85);
  };
  const body = (x, y) => { const dx = (x + 0.5 - cx) / A.rx, dy = (y + 0.5 - cy - wv(x)) / A.ry; return dx * dx + dy * dy <= 1; };
  const mask = (x, y) => x >= 0 && y >= 0 && x < 16 && y < 16 && (body(x, y) || tail(x, y));
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    if (!mask(x, y)) continue;
    const edge = !mask(x + 1, y) || !mask(x - 1, y) || !mask(x, y + 1) || !mask(x, y - 1);
    let c = A.body;
    if (!body(x, y)) c = A.fin;
    else if (y + 0.5 > cy + wv(x) + A.ry * 0.35) c = A.belly;
    if (edge) c = A.out;
    r(col(c), x, y, 1, 1);
  }
  if (!eel && A.ry > 3) for (let x = Math.round(cx) - 2; x <= Math.round(cx); x++) r(col(A.fin), x, Math.round(cy - A.ry) - 1, 1, 1);
  (A.stripe || []).forEach(([x, y, c]) => { if (mask(x, y)) r(col(c), x, y, 1, 1); });
  (A.spot || []).forEach(([x, y, c]) => { if (mask(x, y)) r(col(c), x, y, 1, 1); });
  if (A.whisk) { r(col(A.out), Math.round(cx + A.rx), Math.round(cy + 1), 2, 1); r(col(A.out), Math.round(cx + A.rx), Math.round(cy + 2), 1, 1); }
  const ex = Math.round(cx + A.rx - 2), ey = Math.round(cy - (eel ? 0 : 1) + wv(ex));
  r(col('#ffffff'), ex, ey, 1, 1); r(dim ? '#cdbfb8' : INK, ex + 1, ey, 1, 1);

/* ====== 自動更新：每隔一段時間抓一次線上的 index.html，和目前執行中的程式比對；不一樣就倒數後自動重新整理 ====== */
(function () {
  const isHttp = location.protocol === 'http:' || location.protocol === 'https:';
  if (!isHttp) return;                                   // 本機直接開檔案時不檢查
  const sig = (doc) => Array.from(doc.querySelectorAll('script:not([src]), style')).map(e => e.tagName + e.textContent).join('\u0000');
  let counting = false;
  async function checkUpdate() {
    if (counting || document.hidden) return;             // 分頁在背景時不檢查，切回來才檢查
    try {
      const r = await fetch(location.pathname, { cache: 'no-cache' });   // 帶 ETag 詢問：檔案沒變時伺服器只回 304，幾乎不耗流量
      if (!r.ok) return;
      const remote = new DOMParser().parseFromString(await r.text(), 'text/html');
      if (!remote.querySelector('script:not([src])')) return;      // 抓到怪東西（例如錯誤頁）就不動作
      if (sig(remote) !== sig(document)) startUpdate();
    } catch (e) { /* 離線或暫時失敗，下次再檢查 */ }
  }
  function startUpdate() {
    try {                                                // 防呆：剛重新整理過還是不一樣，就不要無限重整
      const last = +sessionStorage.getItem('autoUpdateAt') || 0;
      if (Date.now() - last < 120000) return;
    } catch (e) {}
    counting = true;
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:50%;top:max(12px,env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:2147483647;background:#fffaf0;border:2px solid #f3c3a6;border-radius:14px;padding:10px 16px;box-shadow:0 4px 16px rgba(0,0,0,.25);color:#6b4848;font:600 14px/1.3 system-ui,sans-serif;max-width:92vw;text-align:center';
    document.body.appendChild(d);
    let n = 5;
    const tick = () => {
      d.textContent = '🎉 有新版本了！' + n + ' 秒後自動更新…';
      if (n-- <= 0) {
        try { sessionStorage.setItem('autoUpdateAt', String(Date.now())); } catch (e) {}
        location.replace(location.pathname + '?v=' + Date.now());
        return;
      }
      setTimeout(tick, 1000);
    };
    tick();
  }
  setTimeout(checkUpdate, 3000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
  setInterval(checkUpdate, 5 * 60 * 1000);
})();

/* 鋤一格：mode = 'till' 只翻還沒翻的草地、'untill' 只把空田翻回草地（多格時由第一格決定，不會一排裡翻來翻去） */
function hoeOne(x, y, mode, loud) {

    act2('till', { p_x: x, p_y: y }); tutEvent('till'); return true;
  }

  settleLocal(p); p.wet = srvNow() + cfg.wet_s * 1000; drops(x, y);

}
function act() {

  }

    }); qAdd('harvest'); refreshHud(); return;

const FSLOT_MS = 1800000;
function forageSlot(sl) {
  const sea = seasonAt(sl * FSLOT_MS), pool = forPool.filter(q => q.season === sea).sort((a, b) => a.key < b.key ? -1 : a.key > b.key ? 1 : 0);
  const tot = pool.reduce((t, q) => t + q.weight, 0), out = [];
  if (!tot) return out;
  for (let i = 0; i < 3; i++) {
    const rr_ = hash(sl, i, 61) * tot; let cs = 0, key = pool[pool.length - 1].key;
    for (const q of pool) { cs += q.weight; if (cs >= rr_) { key = q.key; break; } }
    let x = 1 + Math.floor(hash(sl, i, 63) * (W - 2)), y = 1 + Math.floor(hash(sl, i, 64) * (H - 2));
    for (let n = 0; n < W * H && !(grassTile(x, y) && !farmable(x, y)); n++) { x++; if (x >= W - 1) { x = 1; y = y >= H - 2 ? 1 : y + 1; } }
    out.push({ slot: sl, i, key, x, y });
  }
  return out;
}
function updateForage() {
  const sl = Math.floor(srvNow() / FSLOT_MS);

}

/* ====== 背景音樂：完全由程式即時合成（沒有音檔、沒有版權問題） ======
   C 大調的 Cmaj7 – Am7 – Fmaj7 – G6 循環：柔軟的和弦墊底、低音輕輕點拍、
   音樂盒音色的五聲音階旋律隨機漫步。夜晚變稀疏柔和，廣場變活潑一點。 */
function createMusic(win) {
  const AC = win.AudioContext || win.webkitAudioContext;
  if (!AC) return null;
  const BPM = 66, BEAT = 60 / BPM, BAR = BEAT * 4;
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const PROG = [
    { root: 48, pad: [60, 64, 67, 71] },   // Cmaj7
    { root: 45, pad: [57, 60, 64, 67] },   // Am7
    { root: 41, pad: [60, 64, 65, 69] },   // Fmaj7
    { root: 43, pad: [59, 62, 64, 67] }    // G6
  ];
  const POOL = [72, 74, 76, 79, 81, 84, 86, 88];   // C 五聲音階，兩個八度
  const st = { last: 3, run: 0 };

  function build(ctx) {
    const master = ctx.createGain(); master.gain.value = 0;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -20; comp.ratio.value = 3; comp.attack.value = 0.02; comp.release.value = 0.3;
    const tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 3200; tone.Q.value = 0.4;
    const dry = ctx.createGain(); dry.gain.value = 1;
    const send = ctx.createGain(); send.gain.value = 0.3;
    const dl = ctx.createDelay(1.5); dl.delayTime.value = BEAT * 0.75;
    const fb = ctx.createGain(); fb.gain.value = 0.38;
    const dlp = ctx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2000;
    send.connect(dl); dl.connect(dlp); dlp.connect(fb); fb.connect(dl); dlp.connect(tone);
    dry.connect(tone); tone.connect(comp); comp.connect(master); master.connect(ctx.destination);
    return { ctx, master, tone, dry, send };
  }

  function env(g, t, a, peak, hold, rel) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.setValueAtTime(peak, t + a + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + hold + rel);
  }
  function padNote(b, t, m, dur, vol) {
    const c = b.ctx, g = c.createGain();
    env(g, t, 1.4, vol, Math.max(0.1, dur - 1.4), 2.2);
    [['triangle', -4], ['sine', 5]].forEach(([type, det]) => {
      const o = c.createOscillator(); o.type = type; o.frequency.value = hz(m); o.detune.value = det;
      o.connect(g); o.start(t); o.stop(t + dur + 2.4);

  }
  function bass(b, t, m, dur, vol) {
    const c = b.ctx, g = c.createGain(), o = c.createOscillator();
    o.type = 'sine'; o.frequency.value = hz(m);

    g.gain.linearRampToValueAtTime(vol, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(b.dry); o.start(t); o.stop(t + dur + 0.1);
  }
  function bell(b, t, m, vol, pan) {
    const c = b.ctx, g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.9);
    [[1, 1], [2.01, 0.28], [3.0, 0.09]].forEach(([mul, amp]) => {
      const o = c.createOscillator(), og = c.createGain();
      o.type = 'sine'; o.frequency.value = hz(m) * mul; og.gain.value = amp;
      o.connect(og); og.connect(g); o.start(t); o.stop(t + 2);
    });
    let out = g;
    if (c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = pan; g.connect(p); out = p; }
    out.connect(b.dry); out.connect(b.send);
  }

  /* 排一小節。mood.calm：0 白天 ~ 1 深夜；mood.lively：0 農場 / 1 廣場 */
  function scheduleBar(b, barIdx, t0, mood) {
    const calm = Math.min(1, Math.max(0, mood.calm || 0)), lively = mood.lively ? 1 : 0;
    const ch = PROG[Math.floor(barIdx / 2) % PROG.length];
    if (barIdx % 2 === 0) ch.pad.forEach((m, i) => padNote(b, t0 + i * 0.07, m, BAR * 2 + 0.6, 0.045 - calm * 0.008));
    bass(b, t0, ch.root, BEAT * 1.9, 0.11);
    bass(b, t0 + BEAT * 2, ch.root + (barIdx % 4 === 3 ? 7 : 0), BEAT * 1.7, 0.08);
    const pcs = ch.pad.map(m => m % 12);
    const prob = 0.36 * (1 - 0.6 * calm) + lively * 0.14;
    for (let i = 0; i < 8; i++) {
      if (Math.random() > prob || st.run >= 3) { st.run = 0; continue; }
      let idx = st.last + [-2, -1, -1, 0, 1, 1, 2][Math.floor(Math.random() * 7)];
      idx = Math.min(POOL.length - 1, Math.max(0, idx));
      if (Math.random() < 0.55) {
        for (let d = 0; d < POOL.length; d++) {
          const j = idx + (d % 2 ? -1 : 1) * Math.ceil(d / 2);
          if (j >= 0 && j < POOL.length && pcs.includes(POOL[j] % 12)) { idx = j; break; }
        }
      }
      st.last = idx; st.run++;
      bell(b, t0 + i * BEAT / 2 + (Math.random() - 0.5) * 0.02, POOL[idx], (0.085 - calm * 0.025) * (0.8 + Math.random() * 0.4), (Math.random() - 0.5) * 0.7);
    }
    if (lively && barIdx % 4 === 0) {
      [0, 1, 2, 3].forEach(k => bell(b, t0 + BEAT * 0.25 * k + BEAT * 3, ch.pad[k] + 12, 0.05, k % 2 ? 0.3 : -0.3));
    }
  }

  /* ---- 即時播放 ---- */
  let ctx = null, bus = null, timer = 0, nextT = 0, bar = 0, on = true, vol = 0.5, started = false;
  const mood = { calm: 0, lively: 0 };
  const level = () => (on ? vol * vol * 0.9 : 0);
  function applyLevel() { if (bus) bus.master.gain.setTargetAtTime(level(), ctx.currentTime, 0.35); }
  function tick() {
    if (!ctx || ctx.state !== 'running') return;
    if (nextT < ctx.currentTime) nextT = ctx.currentTime + 0.1;
    while (nextT < ctx.currentTime + 1.6) { scheduleBar(bus, bar, nextT, mood); nextT += BAR; bar++; }
    bus.tone.frequency.setTargetAtTime(3200 - mood.calm * 1700, ctx.currentTime, 1.5);
  }
  function start() {
    if (started || !AC) return;
    started = true;
    try {
      ctx = new AC(); bus = build(ctx);
      if (ctx.resume) ctx.resume();
      nextT = ctx.currentTime + 0.2;
      timer = setInterval(tick, 300);
      tick(); applyLevel();
    } catch (e) { started = false; }
  }
  return {
    start, build, scheduleBar,
    setOn(v) { on = !!v; if (on && !started) start(); else if (ctx && on && ctx.resume) ctx.resume(); applyLevel(); },
    setVolume(v) { vol = Math.min(1, Math.max(0, v)); applyLevel(); },
    setMood(calm, lively) { mood.calm = calm; mood.lively = lively; },
    hidden(h) { if (!ctx) return; if (h) ctx.suspend && ctx.suspend(); else if (on && ctx.resume) ctx.resume(); },
    get on() { return on; }
  };
}

const sitCode = () => pose ? (pose.ground ? 2 : pose.bench ? 1 : 0) : 0;   // 0 站著、1 坐長椅、2 坐在地上

const Music = createMusic(window);
let musicOn = true, musicVol = 50;
try { const m = JSON.parse(localStorage.getItem('dewfarm_music') || 'null'); if (m) { musicOn = m.on !== false; musicVol = clamp(+m.vol || 0, 0, 100); } } catch (e) { /* 用預設值 */ }
/* ---- 場景音檔 BGM：農場、小村、廣場、塔羅屋各有自己的音檔（bgm 資料夾）；
        其他地方（屋子、穀倉）或音檔讀不到時，改用程式合成的音樂。換場景時淡出舊的、淡入新的。 ---- */
const BGM_FILES = { farm: 'bgm/bgm-farm.mp3', town: 'bgm/bgm-town.mp3', plaza: 'bgm/bgm-plaza.mp3', tarot: 'bgm/bgm-tarot.mp3' };
const SCENE_BGM = { farm: 'farm', town: 'town', plaza: 'plaza', tarot: 'tarot' };   // 場景 -> 用哪一首（沒列的場景用合成音樂）
function createSceneBgm(win, urls) {
  const AC = win.AudioContext || win.webkitAudioContext;
  if (!AC || !win.Audio) return null;
  let ctx = null, vol = 0.5, cur = null;
  const T = {}, dead = {};
  const LEVEL = 0.85;                       // 音檔本身偏大聲，留一點餘裕
  function make(name) {
    if (T[name]) return T[name];
    try {
      if (!ctx) ctx = new AC();
      const el = new Audio(); el.loop = true; el.preload = 'auto'; el.setAttribute('playsinline', ''); el.src = urls[name];
      const g = ctx.createGain(); g.gain.value = 0; g.connect(ctx.destination);
      ctx.createMediaElementSource(el).connect(g);          // 走 Web Audio 才能在 iPhone 上調音量
      el.addEventListener('error', () => { dead[name] = true; if (cur === name) cur = null; });   // 讀不到：改由合成音樂接手
      return (T[name] = { el, g, off: 0 });
    } catch (e) { dead[name] = true; return null; }
  }
  const lv = () => vol * LEVEL;
  const fade = (t, to) => t.g.gain.setTargetAtTime(to, ctx.currentTime, 0.6);
  function play(t) {
    if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
    const pr = t.el.play(); if (pr && pr.catch) pr.catch(() => { /* 還沒有手勢：下次點擊再試（nudge） */ });
  }
  return {
    has(name) { return !!urls[name] && !dead[name]; },
    set(name) {                              // name = 要放的那一首；null = 都不放
      if (name === cur) { if (cur) this.nudge(); return; }
      const prev = cur;
      if (prev && T[prev]) { const o = T[prev]; fade(o, 0); clearTimeout(o.off); o.off = setTimeout(() => { if (cur !== prev) o.el.pause(); }, 3500); }   // 淡出完才真的暫停，下次回來接著放
      cur = null;
      if (name && this.has(name)) { const t = make(name); if (t) { clearTimeout(t.off); cur = name; play(t); fade(t, lv()); } }
    },
    setVolume(v) { vol = Math.min(1, Math.max(0, v)); if (cur && T[cur]) fade(T[cur], lv()); },
    nudge() { if (cur && T[cur] && T[cur].el.paused) play(T[cur]); },
    hidden(h) { if (!cur || !T[cur]) return; if (h) T[cur].el.pause(); else play(T[cur]); }
  };
}
const Bgm = createSceneBgm(window, BGM_FILES);
let bgmGesture = false, bgmSig = '';
/* 決定現在該放哪一種：有音檔的場景 → 音檔；其他 → 程式合成。使用者關掉音樂就都不放。 */
function syncBgm() {
  if (!Music) return;
  const name = SCENE_BGM[scene], file = !!(Bgm && name && Bgm.has(name));
  const go = musicOn && bgmGesture;
  const sig = (go ? 1 : 0) + '|' + (file ? name : '') + '|' + musicVol;
  if (sig === bgmSig) return;                 // 沒變就不重複處理（這個函式每秒會被叫一次）
  bgmSig = sig;
  Music.setOn(go && !file);
  if (Bgm) { Bgm.setVolume(musicVol / 100); Bgm.set(go && file ? name : null); }
}
function syncMusicUI() {
  $('music').textContent = '音樂：' + (musicOn ? '開' : '關');
  $('music').setAttribute('aria-pressed', musicOn ? 'true' : 'false');
  $('vol').value = musicVol;
  try { localStorage.setItem('dewfarm_music', JSON.stringify({ on: musicOn, vol: musicVol })); } catch (e) { /* 略過 */ }
}
if (!Music) { $('music').hidden = true; $('vol').hidden = true; }
else {
  Music.setVolume(musicVol / 100); Music.setOn(false); syncMusicUI();
  const first = () => { window.removeEventListener('pointerdown', first); window.removeEventListener('keydown', first); bgmGesture = true; syncBgm(); };
  window.addEventListener('pointerdown', first); window.addEventListener('keydown', first);
  /* 音檔第一次播放要在使用者手勢裡（尤其 iPhone）：之後每次點擊／觸控／按鍵都順手確認一次 */
  ['pointerdown', 'touchend', 'keydown'].forEach(ev => window.addEventListener(ev, () => { if (Bgm) Bgm.nudge(); }, { passive: true }));
  $('music').addEventListener('click', () => { musicOn = !musicOn; syncBgm(); syncMusicUI(); });
  $('vol').addEventListener('input', () => { musicVol = +$('vol').value; Music.setVolume(musicVol / 100); if (musicVol > 0 && !musicOn) { musicOn = true; } syncBgm(); syncMusicUI(); });
  document.addEventListener('visibilitychange', () => { Music.hidden(document.hidden); if (Bgm) Bgm.hidden(document.hidden); });
}

function update(dt) {

  rain.forEach(d => {
    if (snowing) { d.y += dt * 0.05; d.x += Math.sin(d.y / 9 + d.x) * dt * 0.012 - dt * 0.004; }
    else { d.y += dt * 0.26; d.x -= dt * 0.06; }
    if (d.y > H * T) { d.y = -4; d.x = Math.random() * (W * T + 20); }
    if (d.x < 0) d.x += W * T;
  });
  for (let i = fx.length - 1; i >= 0; i--) {
    const p = fx[i];
    p.l += dt; p.x += p.vx * dt / 16; p.y += p.vy * dt / 16; p.vy += 0.05 * dt / 16;
    if (p.l > p.max) fx.splice(i, 1);
  }
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i];
    p.l += dt; p.y -= dt * 0.012;
    if (p.l > 1100) pops.splice(i, 1);
  }
  const lk = Math.min(1, dt / 110);
  remotes.forEach(rp => { rp.x += (rp.tx - rp.x) * lk; rp.y += (rp.ty - rp.y) * lk; });

  if (moodAcc > 1000) { moodAcc = 0; if (Music) { Music.setMood(darkness(world().min), scene === 'plaza'); syncBgm(); } updateBuffChip(); }
  fishTick();
  if (paused()) { actQueued = false; return; }
  if (anim && (pressed.length || pose || pl.prog < 1)) anim = null;   // 走動或坐下就中斷動作
  if (pose) {                                   // 坐著或躺著：家具被搬走、離開屋子或按方向鍵就起身
    const furn = !pose.bench && !pose.ground;             // 坐家具／躺床才需要檢查家具還在不在
    const pit = furn && scene === 'house' && house ? house.items.find(i => i.id === pose.id) : null;
    if (pose.ground ? !syncScene() : scene !== (pose.bench ? 'plaza' : 'house')) pose = null;
    else if (furn && (!pit || pit.x !== pose.ix || pit.y !== pose.iy)) standUp();
    else {
      pose.t += dt;
      if (pose.type === 'lie' && pose.t > 2400) { pose.t = 0; pop(pl.x, pl.y - 0.6, 'Zzz', '#cfe8f7'); }
      if (pressed.length) standUp();

    const d = pressed[pressed.length - 1];

  }

}

const view = { s: S, x: 0, y: 0, snap: true, scene: '' };
const coarseMQ = window.matchMedia ? matchMedia('(pointer:coarse)') : null;
const wantImm = () => !!(coarseMQ && coarseMQ.matches && Math.min(window.innerWidth, window.innerHeight) < 700);
function fitView() {
  const want = wantImm();
  document.body.classList.toggle('imm', want);
  if (want !== imm) { imm = want; view.snap = true; if (!imm) setSide(false); }
  if (imm) {
    const dpr = Math.min(window.devicePixelRatio || 1, 3), rc = cv.getBoundingClientRect();
    const w = Math.max(1, Math.round(rc.width * dpr)), h = Math.max(1, Math.round(rc.height * dpr));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    view.s = Math.max(2, Math.round(Math.min(rc.width, rc.height) / 8 * dpr / T), Math.ceil(h / (H * T)), Math.ceil(w / (W * T)));
  } else {
    if (cv.width !== BW * T * S || cv.height !== BH * T * S) { cv.width = BW * T * S; cv.height = BH * T * S; }
    view.s = S;
  }
}
window.addEventListener('resize', fitView);
window.addEventListener('orientationchange', () => setTimeout(fitView, 120));
if (coarseMQ && coarseMQ.addEventListener) coarseMQ.addEventListener('change', fitView);
let lastInputAt = performance.now();
const wakeUI = () => { lastInputAt = performance.now(); };
['pointerdown', 'pointermove', 'keydown', 'touchstart'].forEach(t => document.addEventListener(t, wakeUI, { passive: true }));
function idleTick(now) {
  chatTick();
  /* 商店、背包、圖鑑這些全頁視窗打開時，把搖桿、動作鈕、工具列、選單把手都藏起來，才不會蓋住視窗底下的按鈕 */
  const modal = imm && (lkOpen || bdOpen || ckOpen || rcOpen || mcOpen || dgOpen || lvOpen || cdOpen || dexOpen || qOpen || dsOpen || stOpen || trOpen || frOpen || mlOpen || bagOpen || shopOpen || makerOpen || authOpen || vmOpen || gmOpen || fOpen || syOpen);
  if (modal !== document.body.classList.contains('modal')) document.body.classList.toggle('modal', modal);
  const idle = imm && !sheetOpen && !pressed.length && now - lastInputAt > 3000;
  if (idle !== document.body.classList.contains('idle')) document.body.classList.toggle('idle', idle);
}
/* 把手：點一下開關；往上（直向）或往左（橫向）滑開；面板頂端的把手往下／往右滑關閉 */
function swipeOf(el, onSwipe) {
  let x0 = 0, y0 = 0, id = null;
  el.addEventListener('pointerdown', e => { id = e.pointerId; x0 = e.clientX; y0 = e.clientY; });
  el.addEventListener('pointerup', e => {
    if (e.pointerId !== id) return; id = null;
    const dx = e.clientX - x0, dy = e.clientY - y0, land = window.innerWidth > window.innerHeight;
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    onSwipe(land ? dx : dy, land);
  });
}
swipeOf($('menubtn'), (d) => { if (d < -20) setSide(true); });
swipeOf($('grab'), (d) => { if (d > 24) setSide(false); });
swipeOf($('side'), (d, land) => { if (land && d > 40) setSide(false); });
$('immgrid').addEventListener('click', e => {
  const b = e.target.closest('button[data-k]');
  if (!b) return;
  setSide(false); dockAct(b.dataset.k);
});

/* 直向沉浸模式：工具列平常只留目前的工具，點一下展開六格，選好再收起來 */
const hbEl = $('hotbar'), portraitNow = () => window.innerHeight >= window.innerWidth;
function setHot(on) { hbEl.classList.toggle('open', !!on); }
hbEl.addEventListener('click', e => {
  if (!imm || !portraitNow()) return;
  if (e.target.closest && e.target.closest('.hbpage')) return;
  if (!hbEl.classList.contains('open')) { e.stopPropagation(); e.preventDefault(); setHot(true); }
  else setHot(false);
}, true);
document.addEventListener('pointerdown', e => { if (hbEl.classList.contains('open') && !hbEl.contains(e.target)) setHot(false); }, true);
fitView();

let last = performance.now();
function frame(now) {
  idleTick(now);
  const dt = Math.min(60, now - last);
  last = now;
  update(dt);
  draw(now);
  requestAnimationFrame(frame);
}

/* ---------- 啟動 ---------- */
async function boot() {
  refreshHud();
  requestAnimationFrame(frame);
  const lib = window.supabase;
  if (!lib || /YOUR-PROJECT/.test(SUPABASE_URL) || /YOUR-PUBLISHABLE/.test(SUPABASE_KEY)) {
    authEl.hidden = true;
    setBoot(lib ? '還沒設定連線' : '無法載入連線元件', lib ? '請把 index.html 最上面的 SUPABASE_URL 與 SUPABASE_KEY 換成你自己專案的值。' : '請檢查網路後重新整理頁面。');
    return;
  }
  sb = lib.createClient(SUPABASE_URL, SUPABASE_KEY);
  setMode('in');
  setBoot('載入中…');
  let sess = null;
  try { sess = (await sb.auth.getSession()).data.session; } catch (e) { /* 當作沒登入 */ }
  if (sess && sess.user && sess.user.email) {
    await enter(sess.user.email.split('@')[0], sess.user.id);
  } else { bootEl.hidden = true; showAuth(); }
  setInterval(() => { if (ready && !document.hidden) { resync(); touchSeen(); mailPoll(); } }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && ready) resync(); });
}
boot();
})();
</script>
